function spawnStory(id) {
  const S = STORY[id], r = G.reg[S.arc];
  G.storyDone[id] = true; r.met = true;
  if (S.type === 'deal') return genCustomer({ ...S.spec, name: REG[S.arc].name, story: id, regular: S.arc });
  return { kind: 'choice', story: id, speaker: S.speaker || S.arc, title: S.title, say: S.say(r), info: S.info ? S.info(r) : '', status: 'talk', mood: '' };
}

function storyFail(c) {
  const S = c.story && STORY[c.story];
  if (S && S.onFail) S.onFail(G.reg[S.arc]);
}

function choose(i) {
  const c = G.cur; if (!c || c.kind !== 'choice' || c.status !== 'talk') return;
  const S = STORY[c.story], r = G.reg[S.arc], ch = S.choices(r)[i];
  if (!ch || (ch.cost && ch.cost > G.cash)) return;
  const [say, mood] = ch.run(r);
  c.say = say; c.mood = mood; c.status = 'done'; c.picked = ch.label;
  log(`<span class="chip y">사연</span><b>${SPEAKERS[c.speaker].name}</b> · ${ch.label}`);
  render();
}

const hearts = a => a < 0 ? `<span class="neg">냉담 ${a}</span>` : '♥'.repeat(a) + '♡'.repeat(5 - a);

let G;

function newGame() {
  G = { phase: 'intro', day: 1, cash: START_CASH, rep: 50, ap: AP_MAX, gold: 58, queue: 0, served: 0,
    cur: null, inv: [], pawns: [], log: [], ticket: 101, uid: 1, report: [],
    reg: Object.fromEntries(Object.keys(REG).map(k => [k, { met: false, aff: 0, flags: {}, note: '' }])),
    storyQ: [], storyDone: {}, perks: {}, bonusQueue: 0, brokerToday: false,
    stats: { deals: 0, pawns: 0, redeemed: 0, forfeited: 0, seized: 0, sold: 0, profit: 0 } };
}

function log(html) { G.log.unshift(`<span class="num">D${G.day}</span> ${html}`); G.log = G.log.slice(0, 60); }

function startDay() {
  G.phase = 'day'; G.ap = AP_MAX; G.served = 0;
  G.storyQ = Object.keys(STORY).filter(id => {
    const S = STORY[id];
    return S.day === G.day && !G.storyDone[id] && (!S.cond || S.cond(G.reg[S.arc]));
  });
  G.brokerToday = !!G.reg.broker.flags.partner;
  G.queue = Math.min(9, 4 + Math.floor(G.rep / 20)) + G.bonusQueue + G.storyQ.length + (G.brokerToday ? 1 : 0);
  nextCustomer();
}

function pickArch() {
  const w = { student: 3, grandma: 2 + G.rep / 40, reseller: 2, nervous: 1.5 + (100 - G.rep) / 40, ceo: 2, lady: 1.6 };
  let t = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const k in w) { t -= w[k]; if (t <= 0) return k; }
  return 'student';
}

function pickCond() {
  const r = Math.random();
  return r < 0.2 ? 'S' : r < 0.6 ? 'A' : r < 0.9 ? 'B' : 'C';
}

function realOf(it) {
  if (it.gold) return it.fake ? it.don * 0.4 : it.don * G.gold * PUR[it.purity] * 0.95;
  return it.real;
}

function genCustomer(spec = {}) {
  const ak = spec.arch || pickArch(), A = ARCH[ak];
  const ik = spec.ik || pick(A.items), I = ITEMS[ik];
  const o = spec.item || {};
  const mode = spec.mode || (Math.random() < A.pawnRate ? 'pawn' : 'sell');
  const fakeP = I.nofake ? 0 : A.fake + (I.fakeBoost || 0);
  const it = { key: ik, name: I.name, e: I.e, gold: !!I.gold, base: I.base,
    fake: o.fake ?? Math.random() < fakeP, stolen: o.stolen ?? Math.random() < A.stolen };
  let perceived;
  if (I.gold) {
    it.don = o.don ?? RI(...I.don);
    it.purity = o.purity ?? pick(['14K', '18K', '18K', '24K']);
    it.claimPurity = it.fake ? pick(['18K', '24K']) : A.honest ? it.purity : '24K';
    it.claimDon = A.honest ? it.don : it.don + RI(0, 2);
    perceived = it.claimDon * G.gold * PUR[it.claimPurity];
  } else {
    it.cond = o.cond ?? pickCond();
    const better = CONDS[Math.max(0, CONDS.indexOf(it.cond) - 1)];
    it.claimCond = A.honest ? (Math.random() < 0.7 ? it.cond : better) : 'S';
    it.real = it.fake ? I.base * R(0.02, 0.05) : I.base * COND[it.cond] * R(0.9, 1.1);
    perceived = I.base * COND[it.claimCond];
  }
  let ask, min;
  if (mode === 'sell') { ask = perceived * (spec.askF ?? R(1.05, 1.3)); min = perceived * (spec.minF ?? R(...A.desp)); }
  else { ask = perceived * (spec.askF ?? R(0.6, 0.8)); min = perceived * (spec.minF ?? R(...A.desp) * 0.6); }
  ask = Math.max(2, Math.round(ask)); min = Math.max(1, Math.min(ask - 1, Math.round(min)));
  const p = RI(...A.patience);
  return { arch: ak, name: spec.name || pick(SURN) + pick(ak === 'grandma' ? GIVEN_OLD : GIVEN), item: it, mode, perceived, ask, min, patience: p, maxPatience: p,
    rev: {}, asked: false, status: 'talk', offer: Math.round(ask * 0.5), say: spec.say || pick(A[mode]), mood: '',
    story: spec.story || null, regular: spec.regular || null };
}

function nextCustomer() {
  if (G.served >= G.queue) { G.cur = null; G.phase = 'closed'; render(); return; }
  const remaining = G.queue - G.served;
  G.served++;
  const special = G.storyQ.length + (G.brokerToday ? 1 : 0);
  if (special && (remaining <= special || (G.served > 1 && Math.random() < 0.45))) {
    if (G.storyQ.length) G.cur = spawnStory(G.storyQ.shift());
    else { G.brokerToday = false; G.cur = genCustomer(BROKER_SUPPLY()); }
  } else G.cur = genCustomer();
  G.cur.fresh = true;
  render();
}

const TOOLS = {
  cond:   { label: '상태 확인', cost: 1 },
  price:  { label: '시세 조회', cost: 1 },
  auth:   { label: '정밀 감정', cost: 2 },
  weigh:  { label: '저울 측정', cost: 1 },
  purity: { label: '순도 검사', cost: 2 },
  origin: { label: '출처 묻기', cost: 0 },
};

function useTool(t) {
  const c = G.cur, it = c.item, T = TOOLS[t];
  if (c.status !== 'talk' || G.ap < T.cost) return;
  if (t === 'origin' ? c.asked : c.rev[t] !== undefined) return;
  G.ap -= T.cost;
  c.mood = '';
  if (t === 'cond') c.rev.cond = it.cond;
  if (t === 'price') c.rev.price = [it.base * 0.9, it.base * 1.1];
  if (t === 'weigh') c.rev.weigh = it.don;
  if (t === 'auth') c.rev.auth = it.fake ? (Math.random() < 0.9 ? '가품' : '정품') : (Math.random() < 0.95 ? '정품' : '가품');
  if (t === 'purity') c.rev.purity = it.fake ? (Math.random() < 0.95 ? '도금' : it.claimPurity) : (Math.random() < 0.95 ? it.purity : pick(Object.keys(PUR)));
  if ((t === 'auth' || t === 'purity') && it.fake && ARCH[c.arch].knowFake) {
    c.patience--; c.say = pick(LINES.fakeNervous); c.mood = 'bad';
    if (c.patience <= 0) return walkOut();
  }
  if (t === 'origin') {
    c.asked = true;
    const nervous = G.perks.sharpEye ? it.stolen : it.stolen ? Math.random() < 0.8 : Math.random() < 0.12;
    c.say = nervous ? pick(LINES.stolen) : pick(ARCH[c.arch].origin);
    c.mood = nervous ? 'bad' : '';
  }
  render();
}

function makeOffer() {
  const c = G.cur, o = Math.round(c.offer);
  if (c.status !== 'talk' || !(o > 0)) return;
  if (o > G.cash) { c.say = '(금고에 그만한 현금이 없다.)'; c.mood = ''; return render(); }
  if (o >= c.ask) return deal(o);
  if (o < c.min * 0.55) {
    c.patience -= 2; c.insulted = true; c.say = pick(LINES.insult); c.mood = 'bad';
  } else {
    c.patience -= 1;
    if (o >= c.min) {
      let p = 0.25 + 0.6 * (o - c.min) / Math.max(1, c.ask - c.min);
      if (c.patience <= 1) p += 0.25;
      if (Math.random() < p) return deal(o);
    }
    c.ask = Math.max(c.min, Math.round(c.ask - (c.ask - o) * R(0.25, 0.45)));
    c.say = fill(pick(c.mode === 'sell' ? LINES.sellCounter : LINES.pawnCounter), c.ask);
    c.mood = '';
  }
  if (c.patience <= 0) return walkOut();
  render();
}

function walkOut() {
  const c = G.cur;
  c.status = 'left'; c.say = pick(LINES.leave); c.mood = 'bad';
  if (c.insulted) { G.rep = clamp(G.rep - 1); }
  storyFail(c);
  log(`<span class="chip r">결렬</span><b>${c.name}</b> 손님이 ${c.item.name}을(를) 들고 나갔다.`);
  render();
}

function deal(price) {
  const c = G.cur, it = c.item, A = ARCH[c.arch];
  if (price > G.cash) return;
  G.cash -= price;
  const known = { ...c.rev };
  let rec;
  if (c.mode === 'sell') {
    rec = { ...it, id: G.uid++, cost: price, rev: known, from: c.name, offer: null, offerDay: 0, broker: c.regular === 'broker' };
    G.inv.push(rec);
    G.stats.deals++;
    log(`<span class="chip y">매입</span><b>${it.name}</b> ${won(price)}`);
  } else {
    let rp = it.fake && A.knowFake ? 0.05 : A.redeem;
    if (price > c.perceived * 0.85) rp *= 0.5;
    rec = { no: G.ticket++, item: { ...it, rev: known }, loan: price, due: G.day + TERM, rp, owner: c.name };
    G.pawns.push(rec);
    G.stats.pawns++;
    log(`<span class="chip y">전당</span><b>${it.name}</b> ${won(price)} 대출 · 기한 D${G.day + TERM}`);
  }
  const ratio = price / c.perceived;
  if (A.vulnerable && ratio < (c.mode === 'sell' ? 0.3 : 0.2)) {
    G.rep = clamp(G.rep - 4); log(`<span class="chip r">평판 -4</span>헐값에 받았다는 소문이 돈다.`);
  } else if (!it.fake && ratio >= (c.mode === 'sell' ? 0.55 : 0.4)) {
    G.rep = clamp(G.rep + 2);
  }
  c.status = 'deal'; c.say = A.accept; c.mood = 'good'; c.final = price;
  const S = c.story && STORY[c.story];
  if (S && S.onDeal) S.onDeal(G.reg[S.arc], price, rec, c);
  render();
}

function rejectGuest() {
  const c = G.cur; if (c.status !== 'talk') return;
  c.status = 'rejected'; c.say = LINES.reject; c.mood = '';
  storyFail(c);
  render();
}

function askBuyer(id) {
  const x = G.inv.find(v => v.id === id);
  if (!x || x.offerDay === G.day || G.phase !== 'day' && G.phase !== 'closed') return;
  x.offerDay = G.day;
  if (x.fake && Math.random() < 0.7) {
    x.offer = Math.max(1, Math.round(realOf(x)));
    x.offerNote = '구매자가 가품을 알아봤다. 평판 -3';
    G.rep = clamp(G.rep - 3);
  } else {
    x.offer = Math.max(1, Math.round(realOf(x) * R(0.85, 1.25) * (0.92 + G.rep / 600)));
    x.offerNote = pick(LINES.buyer) + ' 제시';
  }
  render();
}

function sellItem(id, goldShop) {
  const i = G.inv.findIndex(v => v.id === id); if (i < 0) return;
  const x = G.inv[i];
  const price = goldShop ? Math.max(1, Math.round(realOf(x))) : x.offer;
  if (!price) return;
  G.cash += price; G.inv.splice(i, 1);
  const pf = price - x.cost; G.stats.sold++; G.stats.profit += pf;
  log(`<span class="chip g">판매</span><b>${x.name}</b> ${won(price)} <span class="${pf >= 0 ? 'pos' : 'neg'}">(${pf >= 0 ? '+' : ''}${won(pf)})</span>${goldShop && x.fake ? ' · 도금이었다' : ''}`);
  render();
}

function holdItem(id) { const x = G.inv.find(v => v.id === id); if (x) { x.offer = null; render(); } }

function endDay() {
  const rep = [];
  G.pawns = G.pawns.filter(p => {
    if (p.story || p.due > G.day) return true;
    if (Math.random() < p.rp) {
      const pay = Math.round(p.loan * (1 + INTEREST));
      G.cash += pay; G.stats.redeemed++; G.stats.profit += pay - p.loan;
      rep.push(`<span class="chip g">환매</span>${p.no}번 ${p.owner} 손님이 ${p.item.name}을(를) 찾아갔다. <b class="pos">+${won(pay)}</b>`);
    } else {
      G.inv.push(invFromTicket(p));
      G.stats.forfeited++;
      rep.push(`<span class="chip y">유질</span>${p.no}번 기한 만료. ${p.item.name}이(가) 금고로 들어왔다.`);
    }
    return false;
  });
  const seize = (name, cost) => { G.rep = clamp(G.rep - 12); G.stats.seized++; G.stats.profit -= cost;
    rep.push(`<span class="chip r">압수</span>경찰 방문. ${name}은(는) 도난품이었다. <b class="neg">-${won(cost)}</b>, 평판 -12`); };
  G.inv = G.inv.filter(x => { if (x.stolen && Math.random() < 0.3) { seize(x.name, x.cost); return false; } return true; });
  G.pawns = G.pawns.filter(p => { if (p.item.stolen && Math.random() < 0.3) { seize(p.item.name, p.loan); return false; } return true; });
  if (G.day % 7 === 0) { G.cash -= RENT; rep.push(`<span class="chip r">월세</span>가게 월세를 냈다. <b class="neg">-${won(RENT)}</b>`); }
  const old = G.gold; G.gold = Math.round(G.gold * R(0.95, 1.06) * 10) / 10;
  rep.push(`<span class="chip y">금시세</span>내일 1돈 ${old} → <b>${G.gold}</b>만원`);
  G.report = rep;
  G.phase = G.cash < 0 ? 'bankrupt' : G.day >= DAYS ? 'end' : 'night';
  render();
}

function nextDay() { G.day++; G.inv.forEach(x => { x.offer = null; }); startDay(); }

    });
    const up = () => { V.drag = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    V.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    V.ok = true;
    requestAnimationFrame(loop);
  } catch (e) { V.ok = false; }
}

function loop() {
  requestAnimationFrame(loop);
  const cv = V.r.domElement;
  if (!cv.isConnected || !V.wrap) return;
  const host = cv.parentElement, w = host.clientWidth, h = host.clientHeight;
  if (w && h && (w !== V.w || h !== V.h)) { V.w = w; V.h = h; V.r.setSize(w, h, false); V.cam.aspect = w / h; V.cam.updateProjectionMatrix(); }
  if (!V.drag && !V.reduced) V.ry += 0.005;
  V.wrap.rotation.set(V.rx, V.ry, 0);
  V.r.render(V.scene, V.cam);
}

function stageSet(it) {
  const k = modelKey(it);
  if (V.key === k) return;
  if (V.wrap) { V.scene.remove(V.wrap); dispose(V.wrap); }
  V.wrap = makeModel(it); V.scene.add(V.wrap); V.key = k; V.ry = 0.5; V.rx = 0;
}

function thumb(it, cls = 'th') {
  if (!V.ok || !BUILD[it.key]) return `<span class="e" aria-hidden="true">${it.e}</span>`;
  const k = modelKey(it);
  if (!V.thumbs[k]) {
    const w = makeModel(it); w.rotation.set(0.1, 0.55, 0); V.tScene.add(w);
    const r = V.r, pr = r.getPixelRatio(), aspect = V.cam.aspect;
    r.setPixelRatio(1); r.setSize(120, 120, false); V.cam.aspect = 1; V.cam.updateProjectionMatrix();
    r.render(V.tScene, V.cam);
    V.thumbs[k] = r.domElement.toDataURL('image/png');
    r.setPixelRatio(pr); V.cam.aspect = aspect; V.cam.updateProjectionMatrix();
    V.w = 0; // 다음 프레임에 원래 크기로 복구
    V.tScene.remove(w); dispose(w);
  }
  return `<img class="${cls}" src="${V.thumbs[k]}" alt="">`;
}

function stageHTML(it) {
  V.want = it;
  return `<div class="stage"><span class="fallback" aria-hidden="true">${it.e}</span></div>`;
}

function attachStage() {
  const st = document.querySelector('.stage');
  if (!st || !V.ok || !V.want) return;
  stageSet(V.want);
  st.replaceChildren(V.r.domElement);
  st.insertAdjacentHTML('beforeend', '<span class="stage-cap">드래그해서 돌려보기</span>');
}

/* ---------- 렌더 ---------- */
function knownNotes(it, rev) {
  const rows = [];
  if (rev.cond) rows.push(['상태', `${rev.cond}급`, rev.cond !== it.claimCond ? 'warn' : '']);
  if (rev.price) rows.push(['S급 정품 시세', `${Math.round(rev.price[0])}~${Math.round(rev.price[1])}만원`, '']);
  if (rev.auth) rows.push(['정밀 감정 (90%)', rev.auth, rev.auth === '가품' ? 'warn' : 'ok']);
  if (rev.weigh !== undefined) rows.push(['실측 무게', `${rev.weigh}돈 (${(rev.weigh * 3.75).toFixed(2)}g)`, rev.weigh !== it.claimDon ? 'warn' : '']);
  if (rev.purity) rows.push(['순도 (95%)', rev.purity, rev.purity === '도금' ? 'warn' : rev.purity !== it.claimPurity ? 'warn' : 'ok']);
  return rows;
}

function goldEst(it, rev) {
  if (rev.weigh === undefined || !rev.purity || rev.purity === '도금') return null;
  return rev.weigh * G.gold * PUR[rev.purity] * 0.95;
}

function renderCounter() {
  if (G.phase === 'closed') {
    return `<section class="counter"><div class="qbar"><span>오늘 손님 <b>${G.served}/${G.queue}</b></span></div>

      <div class="actions"><button class="btn primary" data-act="endDay">영업 마감</button></div></section>`;
  }
  const c = G.cur; if (!c) return '';
  if (c.kind === 'choice') return renderChoice(c);
  const it = c.item, A = ARCH[c.arch];
  const claim = it.gold ? `손님 말: ${it.claimPurity}, 약 ${it.claimDon}돈 · 정품 금` : `손님 말: 상태 ${it.claimCond}급 · 정품`;
  const notes = knownNotes(it, c.rev);
  const est = it.gold ? goldEst(it, c.rev) : null;
  if (est !== null) notes.push(['금은방 매입가', won(est), 'ok']);
  const tools = it.gold ? ['weigh', 'purity', 'origin'] : ['cond', 'price', 'auth', 'origin'];
  const low = c.patience <= 1;
  const pat = Array.from({ length: c.maxPatience }, (_, i) => `<i class="${i < c.patience ? 'on' : ''}"></i>`).join('');
  const isPawn = c.mode === 'pawn';
  let deal;
  if (c.status === 'talk') {
    deal = `<div class="deal">
      <div class="askline"><span class="k">${isPawn ? '손님 희망 대출액' : '손님 희망가'}</span><span class="v">${won(c.ask)}</span></div>
      <div class="offer-row">
        <button class="btn step" data-step="-10">−10</button><button class="btn step" data-step="-1">−1</button>
        <input id="offer" type="number" inputmode="numeric" min="1" value="${c.offer}" aria-label="제시 금액(만원)">
        <button class="btn step" data-step="1">+1</button><button class="btn step" data-step="10">+10</button>
        <span class="hint">만원</span>
      </div>
      <div class="offer-row">
        ${[0.4, 0.6, 0.8].map(p => `<button class="btn step" data-pct="${p}">희망가 ${p * 100}%</button>`).join('')}
      </div>
      <div class="actions">
        <button class="btn primary" data-act="offer">${isPawn ? '이 금액 빌려주기' : '이 금액 제시'}</button>
        <button class="btn" data-act="acceptAsk" ${c.ask > G.cash ? 'disabled' : ''}>희망가 수락</button>
        <button class="btn danger" data-act="reject">돌려보내기</button>
      </div>
      <div class="hint">${isPawn ? `전당: 지금 빌려주고 ${TERM}일 뒤 손님이 원금+이자 ${INTEREST * 100}%를 갚으면 환매, 못 갚으면 물건이 내 것이 된다(유질).` : '매입: 사들인 물건은 금고에 들어가고, 오른쪽에서 되팔 수 있다.'}</div>
    </div>`;
  } else {
    const res = c.status === 'deal' ? `거래 성립 · ${won(c.final)}` : c.status === 'left' ? '손님이 떠났다' : '돌려보냈다';
    deal = `<div class="deal"><div class="askline"><span class="k">결과</span><span class="v">${res}</span></div>
      <div class="actions"><button class="btn primary" data-act="next">${G.served >= G.queue ? '오늘 손님 끝' : '다음 손님 들이기'}</button></div></div>`;
  }
  const stamp = c.status === 'deal' ? `<div class="stamp-over">${isPawn ? '전당' : '매입'}</div>` : '';
  const html = `<section class="counter">
    <div class="qbar"><span>오늘 손님 <b>${G.served}/${G.queue}</b></span><span>감정력은 매일 아침 ${AP_MAX}으로 채워진다</span></div>
    <div class="guest">
      <div class="avatar" aria-hidden="true">${A.e}</div>
      <div>
        <div class="who"><strong>${c.name}</strong><span class="tag">${c.regular ? REG[c.regular].label : A.label}</span>${c.regular ? '<span class="chip y">단골</span>' : ''}
          <span class="patience ${low ? 'low' : ''}" title="인내심">인내심 ${pat}</span></div>
        <div class="bubble ${c.mood ? 'mood-' + c.mood : ''}">“${c.say}”</div>
      </div>
    </div>
    <div class="slip ${c.fresh ? 'enter' : ''}">
      <div class="slip-head"><span class="t">감 정 서</span><span class="mode">${isPawn ? '전당 요청' : '매입 요청'}</span></div>
      <div class="item has-stage">${stageHTML(it)}<div><h2>${it.name}</h2><div class="claim">${claim}</div>
      <div class="notes">${notes.length ? notes.map(([l, v, cls]) => `<div><span class="lbl">${l}</span><span class="${cls}">${v}</span></div>`).join('') : '<div class="empty">아직 감정하지 않았다. 아래 도구로 확인하자.</div>'}</div>
      </div></div>

    ${c.status === 'talk' ? `<div class="tools">${tools.map(t => {

      return `<button class="btn" data-tool="${t}" ${used || G.ap < T.cost ? 'disabled' : ''}>${T.label}<span class="c">${T.cost ? '감정력 ' + T.cost : '무료'}</span></button>`;

function renderChoice(c) {
  const S = STORY[c.story], r = G.reg[S.arc], sp = SPEAKERS[c.speaker], isReg = c.speaker in REG;
  const talk = c.status === 'talk';
  const opts = talk ? S.choices(r) : [];
  const html = `<section class="counter">
    <div class="qbar"><span>오늘 손님 <b>${G.served}/${G.queue}</b></span><span>사연 이벤트</span></div>
    <div class="guest">
      <div class="avatar" aria-hidden="true">${sp.e}</div>
      <div>
        <div class="who"><strong>${sp.name}</strong><span class="tag">${sp.label}</span>${isReg ? `<span class="chip y">단골</span><span class="hearts" title="호감도">${hearts(r.aff)}</span>` : ''}</div>
        <div class="bubble ${c.mood ? 'mood-' + c.mood : ''}">“${c.say}”</div>
      </div>
    </div>
    <div class="slip ${c.fresh ? 'enter' : ''}">
      <div class="slip-head"><span class="t">사 연</span><span class="mode">${c.title}</span></div>
      ${S.item ? `<div class="item has-stage">${stageHTML(S.item)}<div><h2>${S.item.name}</h2><div class="claim">${S.item.claim}</div></div></div>` : ''}
      ${c.info ? `<div class="notes"><div><span class="lbl">${c.info}</span></div></div>` : ''}
      ${talk ? `<div class="choices">${opts.map((o, i) => {
        const sub = [o.cost ? '현금 -' + won(o.cost) : '', o.hint || ''].filter(Boolean).join(' · ');
        return `<button class="choice" data-choice="${i}" ${o.cost && o.cost > G.cash ? 'disabled' : ''}><b>${o.label}</b>${sub ? `<span>${sub}</span>` : ''}</button>`;
      }).join('')}</div>`
      : `<div class="notes"><div><span class="lbl">나의 선택</span><span class="ok">${c.picked}</span></div></div>`}
    </div>
    ${talk ? '' : `<div class="deal"><div class="actions"><button class="btn primary" data-act="next">${G.served >= G.queue ? '오늘 손님 끝' : '다음 손님 들이기'}</button></div></div>`}
  </section>`;
  c.fresh = false;
  return html;
}

function renderSide() {
  const canSell = G.phase === 'day' || G.phase === 'closed';
  const inv = G.inv.length ? G.inv.map(x => {
    const notes = knownNotes(x, x.rev || {}).map(r => `${r[0]} ${r[1]}`).join(' · ');
    let act;
    if (x.gold) act = `<div class="offer-box"><span class="q">금은방 매입가 ${won(realOf(x))}<span class="hint"> (오늘 시세)</span></span><button class="btn mini" data-gold="${x.id}" ${canSell ? '' : 'disabled'}>금은방에 팔기</button></div>`;
    else if (x.offer) act = `<div class="offer-box"><span class="q">${x.offerNote}: <b class="num">${won(x.offer)}</b></span><span><button class="btn mini primary" data-sell="${x.id}">판매</button> <button class="btn mini" data-hold="${x.id}">보류</button></span></div>`;
    else act = `<div class="offer-box"><span class="hint">${x.offerDay === G.day ? '오늘은 더 이상 찾는 사람이 없다' : '진열하면 하루 한 번 구매 제안이 온다'}</span><button class="btn mini" data-buyer="${x.id}" ${x.offerDay === G.day || !canSell ? 'disabled' : ''}>진열하기</button></div>`;
    return `<div class="inv-item"><div class="inv-top">${thumb(x)}<span class="n">${x.name}</span><span class="num">${won(x.cost)}</span></div>
      <div class="inv-meta">${x.from}${notes ? ' · ' + notes : ' · 감정 기록 없음'}</div>${act}</div>`;
  }).join('') : '<div class="empty-note">금고가 비어 있다. 손님에게서 물건을 사들이거나, 유질된 전당물이 여기로 온다.</div>';
  const tickets = G.pawns.length ? G.pawns.map(p => `<div class="ticket"><span class="no">No.${p.no} 전당표</span>
      <span class="ticket-row">${thumb(p.item, 'th sm')}<span>${p.item.name} · ${p.owner}</span></span>
      <span class="d">대출 ${won(p.loan)} → 환매 ${won(p.loan * (1 + INTEREST))} · ${p.story ? '사연 진행 중' + (p.out ? ' · 손님이 잠시 빌려 감' : '') : '기한 D' + p.due}</span></div>`).join('')
    : '<div class="empty-note">맡아둔 물건이 없다.</div>';
  const met = Object.keys(REG).filter(k => G.reg[k].met);
  const book = met.length ? met.map(k => `<div class="regular"><span class="e" aria-hidden="true">${REG[k].e}</span>
      <div><div class="n">${REG[k].name} <span class="hearts" title="호감도">${hearts(G.reg[k].aff)}</span></div>
      <div class="inv-meta">${G.reg[k].note || REG[k].label}</div></div></div>`).join('')
    : '<div class="empty-note">아직 단골이 없다. 다시 찾아올 손님은 여기에 적힌다.</div>';
  return `<aside class="side">
    <div class="box"><h3>금고 <small>${G.inv.length}점 · 원가 ${won(G.inv.reduce((a, x) => a + x.cost, 0))}</small></h3><div class="inv">${inv}</div></div>
    <div class="box"><h3>전당표 <small>${G.pawns.length}건</small></h3><div class="tickets">${tickets}</div></div>
    <div class="box"><h3>단골 수첩 <small>${met.length}/${Object.keys(REG).length}명</small></h3><div class="book">${book}</div></div>
    <div class="box"><h3>장부</h3><div class="log">${G.log.length ? G.log.map(l => `<div>${l}</div>`).join('') : '<div>아직 기록이 없다.</div>'}</div></div>
  </aside>`;
}

        <li><b>흥정</b>: 너무 깎으면 인내심이 바닥나 떠난다. 모욕적인 금액은 두 배로 깎인다.</li>
        <li><b>전당</b>: 빌려주고 ${TERM}일 뒤 이자 ${INTEREST * 100}%를 받거나, 못 갚으면 물건을 가진다.</li>
        <li><b>장물</b>: 출처가 수상한 물건은 밤에 경찰이 압수해 갈 수 있다.</li>
        <li><b>금</b>: 저울과 순도 검사로 금은방 매입가를 바로 계산할 수 있다. 시세는 매일 바뀐다.</li>
        <li><b>단골</b>: 다시 찾아오는 손님들이 있다. 오늘의 선택이 그들의 다음 방문을 바꾼다.</li>
      </ul>
      <button class="btn primary" data-act="start">셔터 올리기</button>
    </div></div></div>`;
  }
  if (G.phase === 'night') {
    return `<div class="overlay"><div class="modal"><div class="slip enter">
      <div class="slip-head"><span class="t">영 업 일 지</span><span class="mode">D${G.day} 마감</span></div>
      <h2>${G.day}일차 밤</h2>
      <div class="report">${G.report.map(r => `<div>${r}</div>`).join('')}</div>
      <div class="row"><span>현금</span><span>${won(G.cash)}</span></div>
      <div class="row"><span>평판</span><span>${G.rep}</span></div>

    </div></div></div>`;
  }
  if (G.phase === 'end' || G.phase === 'bankrupt') {
    const bank = G.phase === 'bankrupt';
    const grade = bank ? 'F' : G.cash >= GOAL * 1.3 ? 'S' : G.cash >= GOAL ? 'A' : G.cash >= GOAL * 0.7 ? 'B' : 'C';
    const title = bank ? '월세를 못 내 문을 닫았다' : grade === 'S' ? '골목의 금고왕' : grade === 'A' ? '가게를 지켜냈다' : grade === 'B' ? '겨우 버텼다' : '목표에 못 미쳤다';
    const s = G.stats;
    return `<div class="overlay"><div class="modal"><div class="slip enter">
      <div class="slip-head"><span class="t">결 산 서</span><span class="mode">${bank ? `D${G.day} 폐업` : `D${DAYS} 결산`}</span></div>

      <div class="report">${G.report.map(r => `<div>${r}</div>`).join('')}</div>

      <div class="row"><span>평판</span><span>${G.rep}</span></div>
      <button class="btn primary" data-act="restart">처음부터 다시</button>
    </div></div></div>`;
  }
  return '';
}

function render() {
  V.want = null;
  const ap = Array.from({ length: AP_MAX }, (_, i) => `<i class="${i < G.ap ? 'on' : ''}"></i>`).join('');
  document.getElementById('app').innerHTML = `
    <header class="sign">
      <div class="brand"><span class="seal" aria-hidden="true">典當</span><div><h1>나는 전당포 사장이다</h1><small>골목 전당포 · 프로토타입 v0.3</small></div></div>
      <div class="stats">
        <div class="stat"><span class="k">영업일</span><span class="v">D${G.day}/${DAYS}</span></div>
        <div class="stat"><span class="k">현금</span><span class="v">${won(G.cash)}</span></div>
        <div class="stat"><span class="k">평판</span><span class="v">${G.rep}</span></div>
        <div class="stat"><span class="k">금시세 24K 1돈</span><span class="v">${G.gold}만</span></div>
        <div class="stat"><span class="k">감정력</span><span class="ap" aria-label="감정력 ${G.ap}">${ap}</span></div>

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, c = G.cur;
  if (d.tool) return useTool(d.tool);
  if (d.choice) return choose(Number(d.choice));
  if (d.step && c) { c.offer = Math.max(1, Math.round(c.offer) + Number(d.step)); return render(); }
  if (d.pct && c) { c.offer = Math.max(1, Math.round(c.ask * Number(d.pct))); return render(); }
  if (d.buyer) return askBuyer(Number(d.buyer));
  if (d.sell) return sellItem(Number(d.sell), false);
  if (d.gold) return sellItem(Number(d.gold), true);
  if (d.hold) return holdItem(Number(d.hold));
  switch (d.act) {
    case 'start': return startDay();
    case 'offer': return makeOffer();
    case 'acceptAsk': return deal(c.ask);
    case 'reject': return rejectGuest();
    case 'next': return nextCustomer();
    case 'endDay': return endDay();
    case 'nextDay': return nextDay();
    case 'restart': newGame(); return render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'offer' && G.cur) G.cur.offer = Number(e.target.value) || 0;
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'offer' && e.key === 'Enter') makeOffer();
});

function boot(data) {
  if (!V.r) initViewer();
  if (data && data.G && data.G.reg) G = data.G; else newGame();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
