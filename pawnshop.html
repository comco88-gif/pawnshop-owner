function spawnStory(id) {
  const S = STORY[id], r = G.reg[S.arc];
  G.storyDone[id] = true; r.met = true;
  if (S.type === 'deal') return genCustomer({ ...S.spec, name: REG[S.arc].name, story: id, regular: S.arc });
  return { kind: 'choice', story: id, speaker: S.speaker || S.arc, title: S.title, say: S.say(r), info: S.info ? S.info(r) : '', status: 'talk', mood: '' };
}

function storyFail(c) {
  const S = c.story && STORY[c.story];
  if (S && S.onFail) S.onFail(G.reg[S.arc]);
}

function choose(i) {
  const c = G.cur; if (!c || c.kind !== 'choice' || c.status !== 'talk') return;
  const S = STORY[c.story], r = G.reg[S.arc], ch = S.choices(r)[i];
  if (!ch || (ch.cost && ch.cost > G.cash)) return;
  const [say, mood] = ch.run(r);
  c.say = say; c.mood = mood; c.status = 'done'; c.picked = ch.label;
  log(`<span class="chip y">사연</span><b>${SPEAKERS[c.speaker].name}</b> · ${ch.label}`);
  render();
}

const hearts = a => a < 0 ? `<span class="neg">냉담 ${a}</span>` : '♥'.repeat(a) + '♡'.repeat(5 - a);

let G;

function newGame() {
  G = { phase: 'intro', day: 1, cash: START_CASH, rep: 50, ap: AP_MAX, gold: 58, queue: 0, served: 0,
    cur: null, inv: [], pawns: [], log: [], ticket: 101, uid: 1, report: [],
    reg: Object.fromEntries(Object.keys(REG).map(k => [k, { met: false, aff: 0, flags: {}, note: '' }])),
    storyQ: [], storyDone: {}, perks: {}, bonusQueue: 0, brokerToday: false, tutorial: true, today: [], recent: [], apBought: 0,
    stats: { deals: 0, pawns: 0, redeemed: 0, forfeited: 0, seized: 0, sold: 0, profit: 0 } };
}

function log(html) { G.log.unshift(`<span class="num">D${G.day}</span> ${html}`); G.log = G.log.slice(0, 60); }

function startDay() {
  G.phase = 'day'; G.ap = AP_MAX; G.served = 0; G.apBought = 0; G.today = [];
  G.storyQ = Object.keys(STORY).filter(id => {
    const S = STORY[id];
    return S.day === G.day && !G.storyDone[id] && (!S.cond || S.cond(G.reg[S.arc]));
  });
  G.brokerToday = !!G.reg.broker.flags.partner;
  G.queue = Math.min(9, 4 + Math.floor(G.rep / 20)) + G.bonusQueue + G.storyQ.length + (G.brokerToday ? 1 : 0);
  nextCustomer();
}

function pickArch() {
  const w = { student: 3, grandma: 2 + G.rep / 40, reseller: 2, nervous: 1.5 + (100 - G.rep) / 40, ceo: 2, lady: 1.6, collector: 1.3, bride: 1.2 };
  let t = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const k in w) { t -= w[k]; if (t <= 0) return k; }
  return 'student';
}

// 최근에 나온 물건일수록 덜 나온다 (직전 3명 안이면 0.1배, 6명 안이면 0.45배)
function pickItem(list) {
  const rec = G.recent || (G.recent = []);
  const w = list.map(k => { const i = rec.lastIndexOf(k); return i < 0 ? 1 : rec.length - i <= 3 ? 0.1 : 0.45; });
  let t = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { t -= w[i]; if (t <= 0) return list[i]; }
  return list[list.length - 1];
}

function pickCond() {
  const r = Math.random();
  return r < 0.2 ? 'S' : r < 0.6 ? 'A' : r < 0.9 ? 'B' : 'C';
}

function realOf(it) {
  if (it.gold) return it.fake ? it.don * 0.4 : it.don * G.gold * PUR[it.purity] * 0.95;
  return it.real;
}

function genCustomer(spec = {}) {
  const ak = spec.arch || pickArch(), A = ARCH[ak];
  const ik = spec.ik || pickItem(A.items), I = ITEMS[ik];
  G.recent = [...(G.recent || []), ik].slice(-8);
  const o = spec.item || {};
  const mode = spec.mode || (Math.random() < A.pawnRate ? 'pawn' : 'sell');
  const fakeP = I.nofake ? 0 : A.fake + (I.fakeBoost || 0);
  const it = { key: ik, name: I.name, e: I.e, gold: !!I.gold, base: I.base,
    fake: o.fake ?? Math.random() < fakeP, stolen: o.stolen ?? Math.random() < A.stolen };
  if (SPOTS[ik]) {
    // 가품은 부위마다 티가 날 수도, 잘 베꼈을 수도 있다. 금 외에는 최소 한 곳은 티가 난다.
    const ids = SPOTS[ik].map(s => s.id);
    it.tells = Object.fromEntries(ids.map(id => [id, it.fake && Math.random() < (I.gold ? 0.5 : 0.75)]));
    if (it.fake && !I.gold && !ids.some(id => it.tells[id])) it.tells[pick(ids)] = true;
  }
  it.lock = it.stolen && ['iphone', 'macbook', 'ipad'].includes(ik) && Math.random() < 0.6;
  let perceived;
  if (I.gold) {
    it.don = o.don ?? RI(...I.don);
    it.purity = o.purity ?? I.purity ?? pick(['14K', '18K', '18K', '24K']);
    it.claimPurity = it.fake ? I.purity || pick(['18K', '24K']) : A.honest ? it.purity : '24K';
    it.claimDon = A.honest ? it.don : it.don + RI(0, 2);
    perceived = it.claimDon * G.gold * PUR[it.claimPurity];
  } else {
    it.cond = o.cond ?? pickCond();
    const better = CONDS[Math.max(0, CONDS.indexOf(it.cond) - 1)];
    it.claimCond = A.honest ? (Math.random() < 0.7 ? it.cond : better) : 'S';
    it.real = it.fake ? I.base * R(0.02, 0.05) : I.base * COND[it.cond] * R(0.9, 1.1);
    perceived = I.base * COND[it.claimCond];
  }
  let ask, min;
  if (mode === 'sell') { ask = perceived * (spec.askF ?? R(1.05, 1.3)); min = perceived * (spec.minF ?? R(...A.desp)); }
  else { ask = perceived * (spec.askF ?? R(0.6, 0.8)); min = perceived * (spec.minF ?? R(...A.desp) * 0.6); }
  ask = Math.max(2, Math.round(ask)); min = Math.max(1, Math.min(ask - 1, Math.round(min)));
  if (spec.tellsAll && it.tells) for (const k in it.tells) it.tells[k] = true;
  const p = spec.patience ?? RI(...A.patience);
  return { arch: ak, name: spec.name || pick(SURN) + pick(ak === 'grandma' ? GIVEN_OLD : GIVEN), item: it, mode, perceived, ask, min, patience: p, maxPatience: p,
    rev: {}, asked: false, status: 'talk', offer: Math.round(ask * 0.5), say: spec.say || pick(A[mode]), mood: '',
    story: spec.story || null, regular: spec.regular || null };
}

function nextCustomer() {
  if (G.served >= G.queue) { G.cur = null; G.phase = 'closed'; UI.scrollTo = 'counter'; render(); return; }
  const remaining = G.queue - G.served;
  G.served++;
  const special = G.storyQ.length + (G.brokerToday ? 1 : 0);
  if (G.day === 1 && G.served === 1 && G.tutorial) G.cur = genCustomer(TUTOR());
  else if (special && (remaining <= special || (G.served > 1 && Math.random() < 0.45))) {
    if (G.storyQ.length) G.cur = spawnStory(G.storyQ.shift());
    else { G.brokerToday = false; G.cur = genCustomer(BROKER_SUPPLY()); }
  } else G.cur = genCustomer();
  G.cur.fresh = true;
  UI.scrollTo = 'counter';
  render();
}

function buyAP() {
  const p = apPrice();
  if ((G.apBought || 0) >= AP_BUY_MAX || G.cash < p || G.phase !== 'day') return;
  G.cash -= p; G.ap++; G.apBought = (G.apBought || 0) + 1;
  log(`<span class="chip y">감정력</span>감정력 +1 <span class="neg">-${won(p)}</span>`);
  render();
}

function useTool(t) {
  const c = G.cur, it = c.item, T = TOOLS[t];
  if (c.status !== 'talk' || G.ap < T.cost) return;
  if (t === 'origin' ? c.asked : c.rev[t] !== undefined) return;
  G.ap -= T.cost;
  c.mood = '';
  if (t === 'cond') c.rev.cond = it.cond;
  if (t === 'price') c.rev.price = [it.base * 0.9, it.base * 1.1];
  if (t === 'weigh') c.rev.weigh = it.don;
  if (t === 'auth') c.rev.auth = it.fake ? (Math.random() < 0.9 ? '가품' : '정품') : (Math.random() < 0.95 ? '정품' : '가품');
  if (t === 'purity') c.rev.purity = it.fake ? (Math.random() < 0.95 ? '도금' : it.claimPurity) : (Math.random() < 0.95 ? it.purity : pick(Object.keys(PUR)));
  if (t === 'loupe') { c.rev.loupe = []; UI.scrollTo = 'stage'; }
  if ((t === 'auth' || t === 'purity' || t === 'loupe') && it.fake && ARCH[c.arch].knowFake) {
    c.patience--; c.say = pick(LINES.fakeNervous); c.mood = 'bad';
    if (c.patience <= 0) return walkOut();
  }
  if (t === 'origin') {
    c.asked = true;
    const nervous = G.perks.sharpEye ? it.stolen : it.stolen ? Math.random() < 0.8 : Math.random() < 0.12;
    c.say = nervous ? pick(LINES.stolen) : pick(ARCH[c.arch].origin);
    c.mood = nervous ? 'bad' : '';
  }
  render();
}

function makeOffer() {
  const c = G.cur, o = Math.round(c.offer);
  if (c.status !== 'talk' || !(o > 0)) return;
  if (o > G.cash) { c.say = '(금고에 그만한 현금이 없다.)'; c.mood = ''; return render(); }
  if (o >= c.ask) return deal(o);
  if (o < c.min * 0.55) {
    c.patience -= 2; c.insulted = true; c.say = pick(LINES.insult); c.mood = 'bad';
  } else {
    c.patience -= 1;
    if (o >= c.min) {
      let p = 0.25 + 0.6 * (o - c.min) / Math.max(1, c.ask - c.min);
      if (c.patience <= 1) p += 0.25;
      if (Math.random() < p) return deal(o);
    }
    c.ask = Math.max(c.min, Math.round(c.ask - (c.ask - o) * R(0.25, 0.45)));
    const tone = o >= c.min ? 'close' : o >= c.min * 0.85 ? 'near' : 'far';
    c.say = pick(LINES[tone]) + ' ' + fill(pick(c.mode === 'sell' ? LINES.sellCounter : LINES.pawnCounter), c.ask);
    c.mood = tone === 'far' ? '' : 'good';
  }
  if (c.patience <= 0) return walkOut();
  render();
}

function walkOut() {
  const c = G.cur;
  c.status = 'left'; c.say = pick(LINES.leave); c.mood = 'bad';
  if (c.insulted) { G.rep = clamp(G.rep - 1); }
  remember(c, 'passed');
  storyFail(c);
  log(`<span class="chip r">결렬</span><b>${c.name}</b> 손님이 ${c.item.name}을(를) 들고 나갔다.`);
  render();
}

function deal(price) {
  const c = G.cur, it = c.item, A = ARCH[c.arch];
  if (price > G.cash) return;
  G.cash -= price;
  const known = { ...c.rev };
  let rec;
  if (c.mode === 'sell') {
    rec = { ...it, id: G.uid++, cost: price, rev: known, from: c.name, offer: null, offerDay: 0, broker: c.regular === 'broker' };
    G.inv.push(rec);
    G.stats.deals++;
    log(`<span class="chip y">매입</span><b>${it.name}</b> ${won(price)}`);
  } else {
    let rp = it.fake && A.knowFake ? 0.05 : A.redeem;
    if (price > c.perceived * 0.85) rp *= 0.5;
    rec = { no: G.ticket++, item: { ...it, rev: known }, loan: price, due: G.day + TERM, rp, owner: c.name };
    G.pawns.push(rec);
    G.stats.pawns++;
    log(`<span class="chip y">전당</span><b>${it.name}</b> ${won(price)} 대출 · 기한 D${G.day + TERM}`);
  }
  const ratio = price / c.perceived;
  if (A.vulnerable && ratio < (c.mode === 'sell' ? 0.3 : 0.2)) {
    G.rep = clamp(G.rep - 4); log(`<span class="chip r">평판 -4</span>헐값에 받았다는 소문이 돈다.`);
  } else if (!it.fake && ratio >= (c.mode === 'sell' ? 0.55 : 0.4)) {
    G.rep = clamp(G.rep + 2);
  }
  c.status = 'deal'; c.say = A.accept; c.mood = 'good'; c.final = price;
  remember(c, c.mode === 'sell' ? 'bought' : 'pawned', c.mode === 'sell' ? rec.id : rec.no);
  const S = c.story && STORY[c.story];
  if (S && S.onDeal) S.onDeal(G.reg[S.arc], price, rec, c);
  render();
}

// 밤 정산의 '감정 복기'를 위해 오늘 손에 쥐었거나, 살펴보고 돌려보낸 물건을 적어 둔다
function remember(c, how, ref) {
  const it = c.item;
  if (how === 'passed' && !c.rev.loupe && !c.rev.auth && !c.rev.purity) return;
  (G.today || (G.today = [])).push({ how, ref, key: it.key, name: it.name, fake: it.fake, gold: it.gold, tells: it.tells || {}, looked: c.rev.loupe ? [...c.rev.loupe] : null });
}

function rejectGuest() {
  const c = G.cur; if (c.status !== 'talk') return;
  c.status = 'rejected'; c.say = LINES.reject; c.mood = '';
  remember(c, 'passed');
  storyFail(c);
  render();
}

function askBuyer(id) {
  const x = G.inv.find(v => v.id === id);
  if (!x || x.offerDay === G.day || G.phase !== 'day' && G.phase !== 'closed') return;
  x.offerDay = G.day;
  if (x.fake && Math.random() < 0.7) {
    x.offer = Math.max(1, Math.round(realOf(x)));
    x.offerNote = '구매자가 가품을 알아봤다. 평판 -3';
    G.rep = clamp(G.rep - 3);
  } else {
    x.offer = Math.max(1, Math.round(realOf(x) * R(0.85, 1.25) * (0.92 + G.rep / 600)));
    x.offerNote = pick(LINES.buyer) + ' 제시';
  }
  render();
}

function sellItem(id, goldShop) {
  const i = G.inv.findIndex(v => v.id === id); if (i < 0) return;
  const x = G.inv[i];
  const price = goldShop ? Math.max(1, Math.round(realOf(x))) : x.offer;
  if (!price) return;
  G.cash += price; G.inv.splice(i, 1);
  const pf = price - x.cost; G.stats.sold++; G.stats.profit += pf;
  log(`<span class="chip g">판매</span><b>${x.name}</b> ${won(price)} <span class="${pf >= 0 ? 'pos' : 'neg'}">(${pf >= 0 ? '+' : ''}${won(pf)})</span>${goldShop && x.fake ? ' · 도금이었다' : ''}`);
  render();
}

function holdItem(id) { const x = G.inv.find(v => v.id === id); if (x) { x.offer = null; render(); } }

function reviewDay() {
  const out = [], spotName = (k, ids) => ids.map(id => SPOTS[k].find(s => s.id === id).label).join(', ');
  let fresh = 0;
  for (const e of G.today || []) {
    const tellIds = Object.keys(e.tells).filter(id => e.tells[id]);
    if (e.fake) fresh += unlockDex(e.key, tellIds);
    if (e.how === 'passed') {
      out.push(e.fake ? `<span class="chip g">복기</span>돌려보낸 ${e.name}은(는) 역시 가품이었다.${tellIds.length ? ` 단서: ${spotName(e.key, tellIds)}` : ''}`
        : `<span class="chip y">복기</span>돌려보낸 ${e.name}은(는) 정품이었다. 아까운 물건을 놓쳤다.`);
      continue;
    }
    if (!e.fake) continue;
    const seen = tellIds.filter(id => e.looked && e.looked.includes(id)), unseen = tellIds.filter(id => !seen.includes(id));
    const clue = [seen.length ? `보고도 놓친 단서: ${spotName(e.key, seen)}` : '', unseen.length ? `확인 안 한 단서: ${spotName(e.key, unseen)}` : '',
      !tellIds.length && e.gold ? '순도 검사로만 알 수 있었다' : ''].filter(Boolean).join(' · ');
    out.push(`<span class="chip r">복기</span>${e.how === 'bought' ? '사들인' : '맡아둔'} ${e.name}은(는) 가품이었다.${clue ? ' ' + clue : ''}`);
    const x = e.how === 'bought' ? G.inv.find(v => v.id === e.ref) : (G.pawns.find(t => t.no === e.ref) || {}).item;
    if (x) x.exposed = true;
  }
  if (fresh) out.push(`<span class="chip g">도감</span>감정 도감에 새 단서 ${fresh}개가 기록됐다.`);
  G.today = [];
  return out.length ? ['<b>감정 복기</b>', ...out] : [];
}

function endDay() {
  const review = reviewDay();
  const rep = [];
  G.pawns = G.pawns.filter(p => {
    if (p.story || p.due > G.day) return true;
    if (Math.random() < p.rp) {
      const pay = Math.round(p.loan * (1 + INTEREST));
      G.cash += pay; G.stats.redeemed++; G.stats.profit += pay - p.loan;
      rep.push(`<span class="chip g">환매</span>${p.no}번 ${p.owner} 손님이 ${p.item.name}을(를) 찾아갔다. <b class="pos">+${won(pay)}</b>`);
    } else {
      G.inv.push(invFromTicket(p));
      G.stats.forfeited++;
      rep.push(`<span class="chip y">유질</span>${p.no}번 기한 만료. ${p.item.name}이(가) 금고로 들어왔다.`);
    }
    return false;
  });
  const seize = (name, cost) => { G.rep = clamp(G.rep - 12); G.stats.seized++; G.stats.profit -= cost;
    rep.push(`<span class="chip r">압수</span>경찰 방문. ${name}은(는) 도난품이었다. <b class="neg">-${won(cost)}</b>, 평판 -12`); };
  G.inv = G.inv.filter(x => { if (x.stolen && Math.random() < 0.3) { seize(x.name, x.cost); return false; } return true; });
  G.pawns = G.pawns.filter(p => { if (p.item.stolen && Math.random() < 0.3) { seize(p.item.name, p.loan); return false; } return true; });
  if (G.day % 7 === 0) { G.cash -= RENT; rep.push(`<span class="chip r">월세</span>가게 월세를 냈다. <b class="neg">-${won(RENT)}</b>`); }
  const old = G.gold; G.gold = Math.round(G.gold * R(0.95, 1.06) * 10) / 10;
  rep.push(`<span class="chip y">금시세</span>내일 1돈 ${old} → <b>${G.gold}</b>만원`);
  G.report = [...rep, ...review];
  G.phase = G.cash < 0 ? 'bankrupt' : G.day >= DAYS ? 'end' : 'night';
  render();
}

function nextDay() { G.day++; G.inv.forEach(x => { x.offer = null; }); startDay(); }

const GOLD_HEX = { '24K': '#f0b233', '18K': '#e6be66', '14K': '#d9bf92' };
const PI = Math.PI;
const lin = h => new THREE.Color(h).convertSRGBToLinear();

function mat(hex, metal = 0, rough = 0.5, ext = {}) {

}
function gloss(hex, rough = 0.15, ext = {}) {

function add(g, geo, m, p = [0, 0, 0], r = [0, 0, 0]) {
  const me = new THREE.Mesh(geo, m); me.position.set(...p); me.rotation.set(...r); g.add(me); return me;
}
function rrShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// w(x) × h(y) × d(z) 둥근 상자
function rbox(w, h, d, r, bev = 0.02) {
  const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * bev, h - 2 * bev, Math.max(0.002, r - bev)),
    { depth: Math.max(0.001, d - 2 * bev), bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, curveSegments: 10 });
  g.translate(0, 0, -(d - 2 * bev) / 2);
  return g;
}
const cyl = (rt, rb, h, s = 48) => new THREE.CylinderGeometry(rt, rb, h, s);
function chainAlong(g, curve, n, R, r, m) {
  const geo = new THREE.TorusGeometry(R, r, 8, 18);
  for (let i = 0; i < n; i++) {
    const t = i / n, p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const l = new THREE.Mesh(geo, m);
    l.position.copy(p); l.lookAt(p.clone().add(tan));
    l.rotateZ(i % 2 ? PI / 2 : 0); l.rotateX(PI / 2);
    g.add(l);
  }
}
function canvasTex(key, w, h, draw, rep = 1) {
  if (V.tex[key]) return V.tex[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return (V.tex[key] = t);
}

      const cx = (i + 0.5) * w / 6;
      x.strokeStyle = 'rgba(245,242,232,.85)'; x.lineWidth = 2;
      x.beginPath(); x.arc(cx, h * 0.42, 52, 0, 2 * PI); x.stroke();
      x.beginPath(); x.arc(cx, h * 0.42, 46, 0, 2 * PI); x.stroke();
      crane(cx, h * 0.42, 1.25, i % 2 ? 1 : -1);
      crane(cx + w / 12, h * (i % 2 ? 0.66 : 0.24), 0.9, i % 2 ? -1 : 1);
      x.strokeStyle = 'rgba(245,242,232,.7)'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(cx + 40, h * 0.78); x.bezierCurveTo(cx + 55, h * 0.72, cx + 70, h * 0.84, cx + 85, h * 0.78); x.stroke();
    }
    x.strokeStyle = 'rgba(40,60,50,.18)'; x.lineWidth = 1;
    for (let i = 0; i < 160; i++) { const px = Math.random() * w, py = Math.random() * h; x.beginPath(); x.moveTo(px, py); x.lineTo(px + R(-30, 30), py + R(-30, 30)); x.stroke(); }
  }),
};

/* ---------- 감정 단서: 정품과 가품이 다르게 그려지는 부위 ---------- */
const KR = '"Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const SERIF = 'Georgia, "Times New Roman", serif';

function monoTile(x, ox, oy, s, fake) {
  // 루이비통 모노그램 한 칸(꽃 두 개, 원, LV). 가품은 바탕이 붉고 V가 뒤집혀 있다.
  x.save(); x.translate(ox, oy); x.scale(s / 256, s / 256);
  x.fillStyle = fake ? '#7b4527' : '#5a3a22'; x.fillRect(0, 0, 256, 256);
  x.fillStyle = x.strokeStyle = fake ? '#e7b552' : '#caa56c';
  const flower = (cx, cy, r) => { for (let k = 0; k < 4; k++) { x.beginPath(); x.ellipse(cx + Math.cos(k * PI / 2) * r, cy + Math.sin(k * PI / 2) * r, r * 0.8, r * 0.45, k * PI / 2, 0, 2 * PI); x.fill(); } };
  flower(64, 64, 14); flower(192, 192, 14);
  x.beginPath(); x.arc(192, 64, 14, 0, 2 * PI); x.lineWidth = 6; x.stroke();
  x.font = `italic 700 46px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (fake) { x.fillText('L', 50, 192); x.save(); x.translate(80, 192); x.rotate(PI); x.fillText('V', 0, 0); x.restore(); }
  else x.fillText('LV', 64, 192);
  x.restore();
}
function eng(x, t, px, py, font, ink = 'rgba(30,30,34,.9)', hi = 'rgba(255,255,255,.55)') {
  x.font = font; x.fillStyle = hi; x.fillText(t, px + 1.5, py + 1.5); x.fillStyle = ink; x.fillText(t, px, py);
}
function steelBg(x, w, h, base = '#c3c7cc') {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < h * 1.2; i++) { x.fillStyle = `rgba(255,255,255,${R(0.02, 0.09)})`; x.fillRect(0, Math.random() * h, w, 1); }
}
function noiseBg(x, w, h, base, n = 900) {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) { x.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}
function ringText(x, cx, cy, r, text, font, span, jit) {
  x.font = font; const n = text.length;
  for (let i = 0; i < n; i++) {
    const a = -PI / 2 - span / 2 + (i + 0.5) / n * span + (jit ? R(-jit, jit) : 0);
    x.save(); x.translate(cx, cy); x.rotate(a + PI / 2); x.translate(0, -(r + (jit ? R(-7, 7) : 0)));
    if (jit) x.scale(R(0.8, 1.2), R(0.8, 1.2));
    eng(x, text[i], 0, 0, font); x.restore();
  }
}
function spaced(x, text, cx, cy, jit) {
  const cs = [...text], ws = cs.map(c => x.measureText(c).width), total = ws.reduce((a, b) => a + b, 0);
  let px = cx - total / 2;
  cs.forEach((c, i) => {
    x.save(); x.translate(px + ws[i] / 2, cy + (jit ? R(-jit, jit) : 0)); if (jit) x.rotate(R(-0.13, 0.13));
    x.fillText(c, 0, 0); x.restore(); px += ws[i];
  });
}
function crown(x, cx, cy, s, n, col) {
  x.fillStyle = x.strokeStyle = col; x.lineWidth = s * 0.07; x.lineCap = 'round';
  const by = cy + s * 0.3;
  x.fillRect(cx - s * 0.42, by, s * 0.84, s * 0.12);
  for (let k = 0; k < n; k++) {
    const f = k / (n - 1), a = (f - 0.5) * 1.3, bx = cx + (f - 0.5) * s * 0.7;
    const tx = cx + Math.sin(a) * s * 0.55, ty = by - Math.cos(a) * s * 0.62 + Math.abs(f - 0.5) * s * 0.15;
    x.beginPath(); x.moveTo(bx, by); x.lineTo(tx, ty); x.stroke();
    x.beginPath(); x.arc(tx, ty, s * 0.08, 0, 2 * PI); x.fill();
  }
}
// 가품 인쇄: 살짝 밀리고 기울고 번진다
function misprint(x, w, h, tell, draw) {
  x.save(); x.textAlign = 'center'; x.textBaseline = 'middle';
  if (tell) { x.translate(w * 0.58, h * 0.54); x.rotate(-0.09); x.save(); x.globalAlpha = 0.35; x.translate(4, 3); draw(); x.restore(); }
  else x.translate(w / 2, h / 2);
  draw(); x.restore();
}
function caseBack(x, w, tell, ring, serial, model) {
  x.fillStyle = '#c3c7cc'; x.fillRect(0, 0, w, w);
  for (let r = 4; r < w / 2; r += 2) { x.strokeStyle = `rgba(255,255,255,${R(0.02, 0.12)})`; x.beginPath(); x.arc(w / 2, w / 2, r, 0, 2 * PI); x.stroke(); }
  x.textAlign = 'center'; x.textBaseline = 'middle';
  ringText(x, w / 2, w / 2, 200, ring, '700 30px Arial, sans-serif', tell ? 1.45 * PI : 2 * PI, tell ? 0.035 : 0);
  if (tell) { eng(x, 'STAINLESS STEEL', w / 2, w / 2 - 16, '600 26px Arial, sans-serif'); eng(x, 'WATER RESISTANT', w / 2, w / 2 + 22, '600 22px Arial, sans-serif'); }
  else { eng(x, serial, w / 2, w / 2 - 14, '700 36px "Courier New", monospace'); eng(x, model, w / 2, w / 2 + 30, '600 22px Arial, sans-serif'); }
}
function goldMark(x, w, h, tell, it) {
  const shown = it.fake ? it.claimPurity : it.purity;
  noiseBg(x, w, h, GOLD_HEX[shown] || GOLD_HEX['18K'], 500);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  eng(x, shown + (tell ? ' GP' : ''), w / 2, h * 0.42, `700 ${tell ? 40 : 46}px Arial, sans-serif`, 'rgba(70,45,10,.9)', 'rgba(255,240,200,.6)');
  eng(x, '★', w / 2, h * 0.8, '22px Arial, sans-serif', 'rgba(70,45,10,.8)', 'rgba(255,240,200,.5)');
}

// 단서 부위. 3D 모델에 붙고, 루페 모드에서 확대해 볼 수 있도록 V.building에 등록된다.
function spotTex(it, id, tell) {
  const D = DRAW[it.key + '.' + id];
  return canvasTex(['sp', it.key, id, tell ? 1 : 0, it.gold ? (it.fake ? it.claimPurity : it.purity) : ''].join('|'), D.w, D.h, (x, cw, ch) => D.f(x, cw, ch, tell, it));
}
function spot(g, it, id, pos, rot, w, h, o = {}) {
  const D = DRAW[it.key + '.' + id]; if (!D) return null;
  const tell = !!(it.tells && it.tells[id]);
  const tex = spotTex(it, id, tell);
  const geo = o.geo || (o.circle ? new THREE.CircleGeometry(w / 2, 56) : new THREE.PlaneGeometry(w, h));
  const m = new THREE.MeshStandardMaterial({ map: tex, transparent: !!D.alpha, depthWrite: !D.alpha, metalness: D.metal || 0, roughness: Math.min(1, (D.rough ?? 0.5) + V.wear * 0.5),
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, side: o.geo ? THREE.DoubleSide : THREE.FrontSide });
  const me = add(g, geo, m, pos, rot);
  if (V.building) V.building.push({ id, mesh: me, center: o.center || new THREE.Vector3(), size: o.size || Math.max(w, h) });
  return me;
}
// 상태가 나쁠수록 앞에서부터 흠집 데칼이 붙는다 (S 0곳, A 1곳, B 2곳, C 3곳)
function wearAt(g, pos, rot, w, h, o = {}) {
  if (!(V.scrLeft > 0)) return;
  V.scrLeft--;
  add(g, o.geo || new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: TEX.scratch(V.scrLeft % 3), transparent: true, depthWrite: false, roughness: 0.4,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4, side: o.geo ? THREE.DoubleSide : THREE.FrontSide }), pos, rot);
}

function watch(o, it) {
  const g = new THREE.Group(), steel = mat('#dfe2e6', 1, 0.16), brushed = mat('#c8ccd2', 1, 0.36);
  add(g, cyl(0.62, 0.62, 0.26, 72), steel, [0, 0, -0.012], [PI / 2, 0, 0]);
  add(g, new THREE.TorusGeometry(0.565, 0.075, 24, 96), mat(o.bezel, 0.3, 0.12), [0, 0, 0.14]);

function vase(it) {
  const g = new THREE.Group();

}

  (SPOTS[it.key] || []).map(s => it.tells && it.tells[s.id] ? 1 : 0).join(''), it.lock ? 'L' : ''].join('|');

function makeModel(it) {
  V.wear = WEAR[it.cond] || 0; V.scrLeft = SCRATCHES[it.cond] || 0; V.building = [];
  const m = BUILD[it.key](it);
  const built = V.building;
  V.wear = 0; V.scrLeft = 0; V.building = null;
  const box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const s = 2.3 / Math.max(size.x, size.y, size.z);
  m.scale.setScalar(s); m.position.copy(c.multiplyScalar(-s));
  const wrap = new THREE.Group(); wrap.add(m);
  wrap.updateMatrixWorld(true);
  // 단서 부위를 wrap 기준 위치·방향·확대 거리로 기록해 둔다 (회전 0 상태라 월드 좌표 = wrap 좌표)
  wrap.userData.spots = (SPOTS[it.key] || []).map(def => {
    const b = built.find(x => x.id === def.id); if (!b) return null;
    const q = b.mesh.getWorldQuaternion(new THREE.Quaternion());
    return { id: def.id, label: def.label, p: b.mesh.localToWorld(b.center.clone()), q, n: new THREE.Vector3(0, 0, 1).applyQuaternion(q),
      d: Math.max(0.32, b.size * b.mesh.getWorldScale(new THREE.Vector3()).x * 2.6) };
  }).filter(Boolean);
  return wrap;
}

function dispose(o) {
  if (!o) return;
  o.traverse(n => { if (n.geometry) n.geometry.dispose(); if (n.material) n.material.dispose(); });
}

function makeStage(env) {
  const s = new THREE.Scene(); s.environment = env;
  s.add(new THREE.HemisphereLight(0xfff4e6, 0x2a2018, 0.55));
  const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(2.5, 4, 3.5); s.add(d);
  const sc = document.createElement('canvas'); sc.width = sc.height = 128;
  const x = sc.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  sh.rotation.x = -PI / 2; sh.position.y = -1.3; s.add(sh);
  return s;
}

function envMap(r) {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), new THREE.MeshBasicMaterial({ color: lin('#3d342c'), side: THREE.BackSide })));
  const panel = (w, h, hex, k, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(7, 7, '#ffffff', 3.2, [0, 5.8, 0]);
  panel(2, 8, '#ffffff', 2.2, [-5.8, 0.5, 1]);
  panel(2, 8, '#ffd8a0', 2.0, [5.8, 0.5, -1]);
  panel(6, 3, '#ffffff', 0.9, [0, 0.5, 5.8]);
  return new THREE.PMREMGenerator(r).fromScene(s, 0.035).texture;
}

function initViewer() {
  if (!window.THREE) return;
  try {
    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
    V.r = r;
    const env = envMap(r);
    V.scene = makeStage(env); V.tScene = makeStage(env);
    CAM0 = new THREE.Vector3(0, 1.2, 5.6); LOOK0 = new THREE.Vector3(0, -0.1, 0);
    V.cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); V.cam.position.copy(CAM0); V.cam.lookAt(LOOK0);
    V.tcam = V.cam.clone();
    V.look = LOOK0.clone(); V.camT = CAM0.clone(); V.lookT = LOOK0.clone(); V.qT = new THREE.Quaternion();
    const cv = r.domElement;
    cv.addEventListener('pointerdown', e => { V.drag = { x: e.clientX, y: e.clientY, moved: 0 }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => {
      if (!V.drag) return;
      const dx = e.clientX - V.drag.x, dy = e.clientY - V.drag.y;
      V.drag.x = e.clientX; V.drag.y = e.clientY;
      if (V.focus !== null) { // 확대 중에 끌면 원래 자리로 물러난다
        V.drag.moved += Math.abs(dx) + Math.abs(dy);
        if (V.drag.moved < 8) return;
        unfocus(); stageOverlay(cv.parentElement);
      }
      V.ry += dx * 0.012; V.rx = clamp(V.rx + dy * 0.008, -0.8, 0.8);
    });
    const up = () => { V.drag = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    V.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    V.ok = true;
    requestAnimationFrame(loop);
  } catch (e) { V.ok = false; }
}

let CAM0, LOOK0; // three.js가 없을 수도 있어서 initViewer에서 만든다

function loop() {
  requestAnimationFrame(loop);
  const cv = V.r.domElement;
  if (!cv.isConnected || !V.wrap) return;
  const host = cv.parentElement, w = host.clientWidth, h = host.clientHeight;
  if (w && h && (w !== V.w || h !== V.h)) { V.w = w; V.h = h; V.r.setSize(w, h, false); V.cam.aspect = w / h; V.cam.updateProjectionMatrix(); }
  const k = V.reduced ? 1 : 0.14, sp = V.focus !== null ? V.spots[V.focus] : null;
  if (sp) V.wrap.quaternion.slerp(V.qT, k);
  else {
    if (!V.drag && !V.reduced && !V.loupe) V.ry += 0.005;
    V.rz += -V.rz * k; V.rx += (clamp(V.rx, -0.8, 0.8) - V.rx) * k;
    V.wrap.rotation.set(V.rx, V.ry, V.rz);
  }
  const q = V.wrap.quaternion;
  if (sp) { const p = sp.p.clone().applyQuaternion(q); V.lookT.copy(p); V.camT.set(p.x, p.y, p.z + sp.d); }
  else { V.lookT.copy(LOOK0); V.camT.copy(CAM0); }
  V.cam.position.lerp(V.camT, k); V.look.lerp(V.lookT, k); V.cam.lookAt(V.look); V.cam.updateMatrixWorld();
  V.pins.forEach((el, i) => {
    const s = V.spots[i], p = s.p.clone().applyQuaternion(q);
    const facing = s.n.clone().applyQuaternion(q).dot(V.cam.position.clone().sub(p)) > 0;
    if (sp || !facing) { el.style.display = 'none'; return; }
    p.project(V.cam);
    el.style.display = ''; el.style.left = ((p.x + 1) / 2 * 100) + '%'; el.style.top = ((1 - p.y) / 2 * 100) + '%';
  });
  V.r.render(V.scene, V.cam);
}

function stageSet(it) {
  const k = modelKey(it);
  if (V.key !== k) {
    if (V.wrap) { V.scene.remove(V.wrap); dispose(V.wrap); }
    V.wrap = makeModel(it); V.scene.add(V.wrap); V.key = k; V.ry = 0.5; V.rx = 0; V.rz = 0; V.focus = null;
  }
  V.spots = V.wrap.userData.spots;
}

function unfocus() {
  if (V.focus === null) return;
  const e = new THREE.Euler().setFromQuaternion(V.wrap.quaternion, 'XYZ');
  V.rx = e.x; V.ry = e.y; V.rz = e.z; V.focus = null;
}

// 루페로 한 곳을 들여다본다: 그 면이 카메라를 정면으로 보도록 돌리고 다가간다
function inspectSpot(id) {
  const c = G.cur;
  if (!V.ok || !c || c.kind === 'choice' || c.status !== 'talk' || !c.rev.loupe) return;
  const i = V.spots.findIndex(s => s.id === id); if (i < 0) return;
  V.focus = i; V.qT.copy(V.spots[i].q).invert();
  if (!c.rev.loupe.includes(id)) c.rev.loupe.push(id);
  UI.scrollTo = 'stage';
  render();
}

function thumb(it, cls = 'th') {
  if (!V.ok || !BUILD[it.key]) return `<span class="e" aria-hidden="true">${it.e}</span>`;
  const k = modelKey(it);
  if (!V.thumbs[k]) {
    const w = makeModel(it); w.rotation.set(0.1, 0.55, 0); V.tScene.add(w);
    const r = V.r, pr = r.getPixelRatio();
    r.setPixelRatio(1); r.setSize(120, 120, false);
    r.render(V.tScene, V.tcam);
    V.thumbs[k] = r.domElement.toDataURL('image/png');
    r.setPixelRatio(pr);
    V.w = 0; // 다음 프레임에 원래 크기로 복구
    V.tScene.remove(w); dispose(w);
  }
  return `<img class="${cls}" src="${V.thumbs[k]}" alt="">`;
}

function stageHTML(it, opt = {}) {
  V.want = it; V.wantOpt = opt;
  return `<div class="stage"><span class="fallback" aria-hidden="true">${it.e}</span></div>`;
}

function attachStage() {
  const st = document.querySelector('.stage');
  if (!st || !V.ok || !V.want) { V.pins = []; return; }
  stageSet(V.want);
  st.replaceChildren(V.r.domElement);
  stageOverlay(st);
}

// 캔버스 위에 얹는 것들: 루페 표시(＋), 확대 중 상단 바, 안내 문구
function stageOverlay(st) {
  if (!st) return;
  st.querySelectorAll('.ov').forEach(e => e.remove());
  const o = V.wantOpt || {}, checked = o.checked || [];
  V.loupe = !!o.loupe;
  if (!V.loupe) unfocus();
  const sp = V.focus !== null ? V.spots[V.focus] : null;
  let html = '';
  if (V.loupe && !sp) html += V.spots.map(s => { const done = checked.includes(s.id);
    return `<button class="ov pin ${done ? 'done' : ''}" data-spot="${s.id}" style="display:none" aria-label="${s.label} 들여다보기" title="${s.label}">${done ? '✓' : '+'}</button>`; }).join('');
  if (sp) html += `<div class="ov focus-bar"><span>🔍 ${sp.label}</span><button class="btn mini" data-act="unfocus">전체 보기</button></div>`;
  html += `<span class="ov stage-cap">${sp ? '끌면 원래 자리로 물러난다' : V.loupe ? '＋ 표시를 눌러 루페로 들여다보기' : '드래그해서 돌려보기'}</span>`;
  st.insertAdjacentHTML('beforeend', html);
  V.pins = [...st.querySelectorAll('.pin')];
}

/* ---------- 감정 도감 ---------- */
// 가품을 잡아내거나 밤에 판명되면 그 단서가 기록된다. 판이 바뀌어도 남는다.
const DEX = new Set();
const DEX_ALL = Object.keys(SPOTS).flatMap(k => SPOTS[k].map(s => ({ k, id: s.id, label: s.label, real: s.real, name: ITEMS[k].name })));
const UI = { dex: false, scrollTo: null };
const dexImgs = {};
function unlockDex(k, ids) {
  let n = 0;
  for (const id of ids) { const key = k + '.' + id; if (!DEX.has(key)) { DEX.add(key); n++; } }
  if (n) storeSet('dex', { keys: [...DEX] });
  return n;
}
function dexImg(k, id, tell) {
  const key = [k, id, tell].join('|');
  if (dexImgs[key]) return dexImgs[key];
  const I = ITEMS[k], it = { key: k, gold: !!I.gold, fake: tell, purity: I.purity || '18K', claimPurity: I.purity || '18K', tells: {} };
  return (dexImgs[key] = spotTex(it, id, tell).image.toDataURL('image/png'));
}

/* ---------- 진행 저장 ---------- */
// 플레이어 본인만 읽는 db 공간(data/users/<id>/)에 저장한다. db를 못 쓰는 환경이면 브라우저 저장소로 대신한다.
const STORE = { db: null, uid: null, save: null, timer: 0, writing: false, dirty: false };
async function storeGet(name) {
  if (STORE.db) {
    try { const snap = await STORE.db.doc(`data/users/${STORE.uid}/${name}`).get(); return snap.exists ? snap.data() : null; } catch (e) { /* 아래 로컬로 */ }
  }
  try { return JSON.parse(localStorage.getItem('pawnshop.' + name) || 'null'); } catch (e) { return null; }
}
async function storeSet(name, obj) {
  if (STORE.db) {
    try { await STORE.db.doc(`data/users/${STORE.uid}/${name}`).set(obj); return; }
    catch (e) { if (e && e.code === 'invalid_argument') STORE.db = null; } // 읽기 전용 열람자: 이번 방문은 로컬로
  }
  try { localStorage.setItem('pawnshop.' + name, JSON.stringify(obj)); } catch (e) { /* 저장 불가 환경 */ }
}
async function initStore() {
  try {
    const c = window.claude;
    if (c && c.use) {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      const uid = user ? await user.id() : null;
      if (db && uid) { STORE.db = db; STORE.uid = uid; }
    }
  } catch (e) { /* 로컬로 */ }
  const [save, dex] = await Promise.all([storeGet('save'), storeGet('dex')]);
  (dex && dex.keys || []).forEach(k => DEX.add(k));
  if (save && save.g) STORE.save = save;
  if (G.phase === 'intro' || DEX.size) render();
}
function scheduleSave() {
  clearTimeout(STORE.timer);
  STORE.timer = setTimeout(flushSave, 1200);
}
async function flushSave() {
  if (STORE.writing) { STORE.dirty = true; return; }
  STORE.writing = true;
  const over = G.phase === 'end' || G.phase === 'bankrupt';
  await storeSet('save', over ? { g: null } : { at: Date.now(), day: G.day, cash: G.cash, g: JSON.stringify(G) });
  STORE.writing = false;
  if (STORE.dirty) { STORE.dirty = false; flushSave(); }
}
function continueGame() {
  if (!STORE.save) return;
  try { G = JSON.parse(STORE.save.g); } catch (e) { STORE.save = null; return render(); }
  STORE.save = null; V.key = null;
  render();
}

/* ---------- 렌더 ---------- */
function knownNotes(it, rev) {
  const rows = [];
  if (it.exposed) rows.push(['판명', '가품', 'warn']);
  if (rev.cond) rows.push(['상태', `${rev.cond}급`, rev.cond !== it.claimCond ? 'warn' : '']);
  if (rev.price) rows.push(['S급 정품 시세', `${Math.round(rev.price[0])}~${Math.round(rev.price[1])}만원`, '']);
  if (rev.auth) rows.push(['정밀 감정 (90%)', rev.auth, rev.auth === '가품' ? 'warn' : 'ok']);
  if (rev.loupe) rows.push(['루페 감정', `${rev.loupe.length}/${(SPOTS[it.key] || []).length}곳 확인`, '']);
  if (rev.weigh !== undefined) rows.push(['실측 무게', `${rev.weigh}돈 (${(rev.weigh * 3.75).toFixed(2)}g)`, rev.weigh !== it.claimDon ? 'warn' : '']);
  if (rev.purity) rows.push(['순도 (95%)', rev.purity, rev.purity === '도금' ? 'warn' : rev.purity !== it.claimPurity ? 'warn' : 'ok']);
  return rows;
}

function goldEst(it, rev) {
  if (rev.weigh === undefined || !rev.purity || rev.purity === '도금') return null;
  return rev.weigh * G.gold * PUR[rev.purity] * 0.95;
}

function renderCounter() {
  if (G.phase === 'closed') {
    return `<section class="counter"><div class="qbar"><span>오늘 손님 <b>${G.served}/${G.queue}</b></span></div>
      <div class="bubble">마지막 손님이 나갔다. 금고에 있는 물건을 정리하고 셔터를 내리자.</div>${tipHTML(null)}
      <div class="actions"><button class="btn primary" data-act="endDay">영업 마감</button></div></section>`;
  }
  const c = G.cur; if (!c) return '';
  if (c.kind === 'choice') return renderChoice(c);
  const it = c.item, A = ARCH[c.arch];
  const claim = it.gold ? `손님 말: ${it.claimPurity}, 약 ${it.claimDon}돈 · 정품 금` : `손님 말: 상태 ${it.claimCond}급 · 정품`;
  const notes = knownNotes(it, c.rev);
  const est = it.gold ? goldEst(it, c.rev) : null;
  if (est !== null) notes.push(['금은방 매입가', won(est), 'ok']);
  // 3D가 되면 확률형 정밀 감정 대신 루페로 직접 본다. 전자기기는 가품이 없어 감정 도구가 없다.
  const eye = V.ok && SPOTS[it.key] ? ['loupe'] : [];
  const tools = it.gold ? ['weigh', 'purity', ...eye, 'origin'] : ['cond', 'price', ...(ITEMS[it.key].nofake ? [] : eye.length ? eye : ['auth']), 'origin'];
  const looking = c.status === 'talk' && c.rev.loupe;
  const eyeList = looking ? `<div class="eye"><div class="eye-h"><b>정품 체크 포인트</b><span>물건과 기준을 비교해 직접 판단하자</span></div>
    ${SPOTS[it.key].map(s => { const done = c.rev.loupe.includes(s.id);
      return `<button class="eye-row ${done ? 'done' : ''}" data-spot="${s.id}"><b>${done ? '✓' : '○'} ${s.label}</b><span>${s.real}</span></button>`; }).join('')}</div>` : '';
  const low = c.patience <= 1;
  const pat = Array.from({ length: c.maxPatience }, (_, i) => `<i class="${i < c.patience ? 'on' : ''}"></i>`).join('');
  const isPawn = c.mode === 'pawn';
  // 흥정 단위는 희망가 자릿수를 따라간다: 85만원이면 1·10, 1,250만원이면 10·100·1,000
  const top = 10 ** Math.floor(Math.log10(Math.max(1, c.ask)));
  const steps = [...new Set([top / 100, top / 10, top].map(n => Math.max(1, n)))];
  let deal;
  if (c.status === 'talk') {
    deal = `<div class="deal">
      <div class="askline"><span class="k">${isPawn ? '손님 희망 대출액' : '손님 희망가'}</span><span class="v">${won(c.ask)}</span></div>
      <div class="offer-row">
        <input id="offer" type="number" inputmode="numeric" min="1" value="${c.offer}" aria-label="제시 금액(만원)">
        <span class="hint">만원</span>
      </div>
      <div class="steps" style="grid-template-columns: repeat(${steps.length * 2}, minmax(0, 1fr))">
        ${steps.slice().reverse().map(n => `<button class="btn step" data-step="${-n}">−${n.toLocaleString('ko-KR')}</button>`).join('')}
        ${steps.map(n => `<button class="btn step" data-step="${n}">+${n.toLocaleString('ko-KR')}</button>`).join('')}
      </div>
      <div class="offer-row">
        ${[0.4, 0.6, 0.8].map(p => `<button class="btn step" data-pct="${p}">희망가 ${p * 100}%</button>`).join('')}
      </div>
      <div class="actions">
        <button class="btn primary" data-act="offer">${isPawn ? '이 금액 빌려주기' : '이 금액 제시'}</button>
        <button class="btn" data-act="acceptAsk" ${c.ask > G.cash ? 'disabled' : ''}>희망가 수락</button>
        <button class="btn danger" data-act="reject">돌려보내기</button>
      </div>
      <div class="hint">${isPawn ? `전당: 지금 빌려주고 ${TERM}일 뒤 손님이 원금+이자 ${INTEREST * 100}%를 갚으면 환매, 못 갚으면 물건이 내 것이 된다(유질).` : '매입: 사들인 물건은 금고에 들어가고, 오른쪽에서 되팔 수 있다.'}</div>
    </div>`;
  } else {
    const res = c.status === 'deal' ? `거래 성립 · ${won(c.final)}` : c.status === 'left' ? '손님이 떠났다' : '돌려보냈다';
    deal = `<div class="deal"><div class="askline"><span class="k">결과</span><span class="v">${res}</span></div>
      <div class="actions"><button class="btn primary" data-act="next">${G.served >= G.queue ? '오늘 손님 끝' : '다음 손님 들이기'}</button></div></div>`;
  }
  const stamp = c.status === 'deal' ? `<div class="stamp-over">${isPawn ? '전당' : '매입'}</div>` : '';
  const html = `<section class="counter">
    <div class="qbar"><span>오늘 손님 <b>${G.served}/${G.queue}</b></span><span>감정력은 매일 아침 ${AP_MAX}으로 채워진다</span></div>
    <div class="guest">
      <div class="avatar" aria-hidden="true">${A.e}</div>
      <div>
        <div class="who"><strong>${c.name}</strong><span class="tag">${c.regular ? REG[c.regular].label : A.label}</span>${c.regular ? '<span class="chip y">단골</span>' : ''}
          <span class="patience ${low ? 'low' : ''}" title="인내심">인내심 ${pat}</span></div>
        <div class="bubble ${c.mood ? 'mood-' + c.mood : ''}">“${c.say}”</div>
      </div>
    </div>
    <div class="slip ${c.fresh ? 'enter' : ''}">
      <div class="slip-head"><span class="t">감 정 서</span><span class="mode">${isPawn ? '전당 요청' : '매입 요청'}</span></div>
      <div class="item has-stage">${stageHTML(it, { loupe: !!looking, checked: c.rev.loupe || [] })}<div><h2>${it.name}</h2><div class="claim">${claim}</div>
      <div class="notes">${notes.length ? notes.map(([l, v, cls]) => `<div><span class="lbl">${l}</span><span class="${cls}">${v}</span></div>`).join('') : '<div class="empty">아직 감정하지 않았다. 물건을 돌려보거나 아래 도구로 확인하자.</div>'}</div>
      ${eyeList}
      </div></div>
      ${stamp}
    </div>
    ${c.status === 'talk' ? `<div class="tools">${tools.map(t => {
      const T = TOOLS[t], used = t === 'origin' ? c.asked : c.rev[t] !== undefined;
      return `<button class="btn" data-tool="${t}" ${used || G.ap < T.cost ? 'disabled' : ''}>${T.label}<span class="c">${T.cost ? '감정력 ' + T.cost : '무료'}</span></button>`;
    }).join('')}
      <button class="btn danger" data-act="buyAP" ${(G.apBought || 0) >= AP_BUY_MAX || G.cash < apPrice() ? 'disabled' : ''} title="오늘 ${AP_BUY_MAX - (G.apBought || 0)}번 더 살 수 있다">감정력 +1 사기<span class="c">${(G.apBought || 0) >= AP_BUY_MAX ? '오늘 끝' : `${won(apPrice())} · ${AP_BUY_MAX - (G.apBought || 0)}회`}</span></button></div>` : ''}
    ${tipHTML(c)}
    ${deal}
  </section>`;
  c.fresh = false;
  return html;
}

// 첫날 도움말: 지금 할 일을 하나씩 알려준다
function tipHTML(c) {
  if (!G.tutorial || G.day > 1) return '';
  let t;
  if (G.phase === 'closed') t = '오늘 장사 끝. 금고의 물건은 <b>진열하기</b>로 구매 제안을 받거나, 금은 금은방에 바로 판다. 정리가 끝나면 <b>영업 마감</b>. 밤에는 오늘 감정을 복기해 준다.';
  else if (!c || c.kind === 'choice') return '';
  else if (c.status !== 'talk') t = '거래가 어땠는지는 밤 정산의 <b>감정 복기</b>에서 알려준다. 다음 손님을 들이자.';
  else if (G.served === 1 && !c.rev.loupe) t = '① 손님 말만 믿지 말자. 물건은 드래그로 돌려볼 수 있다. <b>루페 감정</b>을 눌러 직접 들여다보자.';
  else if (G.served === 1 && c.rev.loupe.length < SPOTS[c.item.key].length) t = '② 모델 위의 <b>＋</b>를 눌러 확대하고, 감정서의 <b>정품 체크 포인트</b>와 비교하자.';
  else if (G.served === 1) t = '③ 기준과 다르면 가품이다. 가품이면 <b>돌려보내기</b>. 정품이면 금액을 정해 흥정한다. 낮게 부르면 손님 말투로 마지노선이 드러난다.';
  else if (c.item.gold) t = '금은 <b>저울 측정</b>과 <b>순도 검사</b>로 금은방 매입가를 바로 알 수 있다. 각인에 GP가 있으면 도금이다.';
  else if (c.mode === 'pawn') t = '전당: 지금 빌려주면 3일 뒤 이자 12%와 함께 돌아오거나, 못 갚으면 물건이 내 것이 된다.';
  else if (G.ap <= 2) t = '감정력이 모자라면 <b>감정력 +1 사기</b>로 현금을 주고 더 살 수 있다. 살수록 비싸진다.';
  else t = '<b>출처 묻기</b>는 무료다. 말을 더듬는 손님의 물건은 장물일 수 있고, 밤에 경찰이 압수해 간다.';
  return `<div class="tip"><span>💡 ${t}</span><button class="btn mini" data-act="tipOff">도움말 끄기</button></div>`;
}

function renderChoice(c) {
  const S = STORY[c.story], r = G.reg[S.arc], sp = SPEAKERS[c.speaker], isReg = c.speaker in REG;
  const talk = c.status === 'talk';
  const opts = talk ? S.choices(r) : [];
  const html = `<section class="counter">
    <div class="qbar"><span>오늘 손님 <b>${G.served}/${G.queue}</b></span><span>사연 이벤트</span></div>
    <div class="guest">
      <div class="avatar" aria-hidden="true">${sp.e}</div>
      <div>
        <div class="who"><strong>${sp.name}</strong><span class="tag">${sp.label}</span>${isReg ? `<span class="chip y">단골</span><span class="hearts" title="호감도">${hearts(r.aff)}</span>` : ''}</div>
        <div class="bubble ${c.mood ? 'mood-' + c.mood : ''}">“${c.say}”</div>
      </div>
    </div>
    <div class="slip ${c.fresh ? 'enter' : ''}">
      <div class="slip-head"><span class="t">사 연</span><span class="mode">${c.title}</span></div>
      ${S.item ? `<div class="item has-stage">${stageHTML(S.item)}<div><h2>${S.item.name}</h2><div class="claim">${S.item.claim}</div></div></div>` : ''}
      ${c.info ? `<div class="notes"><div><span class="lbl">${c.info}</span></div></div>` : ''}
      ${talk ? `<div class="choices">${opts.map((o, i) => {
        const sub = [o.cost ? '현금 -' + won(o.cost) : '', o.hint || ''].filter(Boolean).join(' · ');
        return `<button class="choice" data-choice="${i}" ${o.cost && o.cost > G.cash ? 'disabled' : ''}><b>${o.label}</b>${sub ? `<span>${sub}</span>` : ''}</button>`;
      }).join('')}</div>`
      : `<div class="notes"><div><span class="lbl">나의 선택</span><span class="ok">${c.picked}</span></div></div>`}
    </div>
    ${talk ? '' : `<div class="deal"><div class="actions"><button class="btn primary" data-act="next">${G.served >= G.queue ? '오늘 손님 끝' : '다음 손님 들이기'}</button></div></div>`}
  </section>`;
  c.fresh = false;
  return html;
}

function renderSide() {
  const canSell = G.phase === 'day' || G.phase === 'closed';
  const inv = G.inv.length ? G.inv.map(x => {
    const notes = knownNotes(x, x.rev || {}).map(r => `${r[0]} ${r[1]}`).join(' · ');
    let act;
    if (x.gold) act = `<div class="offer-box"><span class="q">금은방 매입가 ${won(realOf(x))}<span class="hint"> (오늘 시세)</span></span><button class="btn mini" data-gold="${x.id}" ${canSell ? '' : 'disabled'}>금은방에 팔기</button></div>`;
    else if (x.offer) act = `<div class="offer-box"><span class="q">${x.offerNote}: <b class="num">${won(x.offer)}</b></span><span><button class="btn mini primary" data-sell="${x.id}">판매</button> <button class="btn mini" data-hold="${x.id}">보류</button></span></div>`;
    else act = `<div class="offer-box"><span class="hint">${x.offerDay === G.day ? '오늘은 더 이상 찾는 사람이 없다' : '진열하면 하루 한 번 구매 제안이 온다'}</span><button class="btn mini" data-buyer="${x.id}" ${x.offerDay === G.day || !canSell ? 'disabled' : ''}>진열하기</button></div>`;
    return `<div class="inv-item"><div class="inv-top">${thumb(x)}<span class="n">${x.name}</span><span class="num">${won(x.cost)}</span></div>
      <div class="inv-meta">${x.from}${notes ? ' · ' + notes : ' · 감정 기록 없음'}</div>${act}</div>`;
  }).join('') : '<div class="empty-note">금고가 비어 있다. 손님에게서 물건을 사들이거나, 유질된 전당물이 여기로 온다.</div>';
  const tickets = G.pawns.length ? G.pawns.map(p => `<div class="ticket"><span class="no">No.${p.no} 전당표</span>
      <span class="ticket-row">${thumb(p.item, 'th sm')}<span>${p.item.name} · ${p.owner}</span></span>
      <span class="d">대출 ${won(p.loan)} → 환매 ${won(p.loan * (1 + INTEREST))} · ${p.story ? '사연 진행 중' + (p.out ? ' · 손님이 잠시 빌려 감' : '') : '기한 D' + p.due}</span></div>`).join('')
    : '<div class="empty-note">맡아둔 물건이 없다.</div>';
  const met = Object.keys(REG).filter(k => G.reg[k].met);
  const book = met.length ? met.map(k => `<div class="regular"><span class="e" aria-hidden="true">${REG[k].e}</span>
      <div><div class="n">${REG[k].name} <span class="hearts" title="호감도">${hearts(G.reg[k].aff)}</span></div>
      <div class="inv-meta">${G.reg[k].note || REG[k].label}</div></div></div>`).join('')
    : '<div class="empty-note">아직 단골이 없다. 다시 찾아올 손님은 여기에 적힌다.</div>';
  return `<aside class="side">
    <div class="box"><h3>금고 <small>${G.inv.length}점 · 원가 ${won(G.inv.reduce((a, x) => a + x.cost, 0))}</small></h3><div class="inv">${inv}</div></div>
    <div class="box"><h3>전당표 <small>${G.pawns.length}건</small></h3><div class="tickets">${tickets}</div></div>
    <div class="box"><h3>감정 도감 <small>${DEX.size}/${DEX_ALL.length}곳</small></h3>
      <div class="offer-box"><span class="hint">가품을 잡아내거나 밤에 판명되면 단서가 기록된다. 판이 바뀌어도 남는다.</span><button class="btn mini" data-act="dex">도감 펼치기</button></div></div>
    <div class="box"><h3>단골 수첩 <small>${met.length}/${Object.keys(REG).length}명</small></h3><div class="book">${book}</div></div>
    <div class="box"><h3>장부</h3><div class="log">${G.log.length ? G.log.map(l => `<div>${l}</div>`).join('') : '<div>아직 기록이 없다.</div>'}</div></div>
  </aside>`;
}

function renderDex() {
  const rows = DEX_ALL.map(d => {
    const open = DEX.has(d.k + '.' + d.id);
    const imgs = open && V.ok ? `<figure><img src="${dexImg(d.k, d.id, false)}" alt=""><figcaption>정품</figcaption></figure><figure><img src="${dexImg(d.k, d.id, true)}" alt=""><figcaption>가품</figcaption></figure>`
      : `<div class="dex-lock">${open ? '✓' : '?'}</div>`;
    return `<div class="dex-row ${open ? '' : 'locked'}"><div class="dex-imgs">${imgs}</div><div><b>${d.name} · ${d.label}</b><span>${open ? d.real : '아직 잡아내지 못한 단서'}</span></div></div>`;
  }).join('');
  return `<div class="overlay" data-act="dexClose"><div class="modal wide" data-stop><div class="slip">
    <div class="slip-head"><span class="t">감 정 도 감</span><span class="mode">${DEX.size} / ${DEX_ALL.length}</span></div>
    <div class="dex">${rows}</div>
    <button class="btn primary" data-act="dexClose">닫기</button>
  </div></div></div>`;
}

function renderModal() {
  if (UI.dex) return renderDex();
  if (G.phase === 'intro') {
    return `<div class="overlay"><div class="modal"><div class="slip enter">
      <div class="slip-head"><span class="t">개 업 안 내</span><span class="mode">D1 / D${DAYS}</span></div>
      <h2>나는 전당포 사장이다</h2>
      <p>삼촌에게 물려받은 골목 전당포. 금고엔 ${won(START_CASH)}, 월세는 7일마다 ${won(RENT)}.</p>
      <p><b>${DAYS}일 뒤 현금 ${won(GOAL)}</b>을 만들면 가게를 지킨다.</p>
      <ul>
        <li><b>감정</b>: 하루 감정력 ${AP_MAX}. 상태, 시세, 진품 여부를 확인해 손님 말의 진위를 가린다. 모자라면 현금으로 하루 ${AP_BUY_MAX}번까지 더 살 수 있다(살수록 비싸진다).</li>
        <li><b>루페</b>: 물건은 드래그로 돌려볼 수 있다. 루페를 들면 확인할 곳이 표시되고, 눌러서 확대해 정품 기준과 직접 비교한다. 흠집이나 잠긴 화면도 놓치지 말자.</li>
        <li><b>흥정</b>: 너무 깎으면 인내심이 바닥나 떠난다. 모욕적인 금액은 두 배로 깎인다.</li>
        <li><b>전당</b>: 빌려주고 ${TERM}일 뒤 이자 ${INTEREST * 100}%를 받거나, 못 갚으면 물건을 가진다.</li>
        <li><b>장물</b>: 출처가 수상한 물건은 밤에 경찰이 압수해 갈 수 있다.</li>
        <li><b>금</b>: 저울과 순도 검사로 금은방 매입가를 바로 계산할 수 있다. 시세는 매일 바뀐다.</li>
        <li><b>단골</b>: 다시 찾아오는 손님들이 있다. 오늘의 선택이 그들의 다음 방문을 바꾼다.</li>
        <li><b>복기와 도감</b>: 밤마다 오늘 감정이 맞았는지 알려주고, 잡아낸 가품 단서는 도감에 모인다. 진행은 자동 저장된다.</li>
      </ul>
      ${STORE.save ? `<button class="btn primary" data-act="continue">이어하기 · D${STORE.save.day} · 현금 ${won(STORE.save.cash)}</button> <button class="btn" data-act="start">새로 시작</button>`
        : '<button class="btn primary" data-act="start">셔터 올리기</button>'}
    </div></div></div>`;
  }
  if (G.phase === 'night') {
    return `<div class="overlay"><div class="modal"><div class="slip enter">
      <div class="slip-head"><span class="t">영 업 일 지</span><span class="mode">D${G.day} 마감</span></div>
      <h2>${G.day}일차 밤</h2>
      <div class="report">${G.report.map(r => `<div>${r}</div>`).join('')}</div>
      <div class="row"><span>현금</span><span>${won(G.cash)}</span></div>
      <div class="row"><span>평판</span><span>${G.rep}</span></div>
      <div class="row"><span>다음 월세</span><span>D${Math.ceil((G.day + 1) / 7) * 7}</span></div>
      <button class="btn primary" data-act="nextDay">${G.day + 1}일차 문 열기</button>
    </div></div></div>`;
  }
  if (G.phase === 'end' || G.phase === 'bankrupt') {
    const bank = G.phase === 'bankrupt';
    const grade = bank ? 'F' : G.cash >= GOAL * 1.3 ? 'S' : G.cash >= GOAL ? 'A' : G.cash >= GOAL * 0.7 ? 'B' : 'C';
    const title = bank ? '월세를 못 내 문을 닫았다' : grade === 'S' ? '골목의 금고왕' : grade === 'A' ? '가게를 지켜냈다' : grade === 'B' ? '겨우 버텼다' : '목표에 못 미쳤다';
    const s = G.stats;
    return `<div class="overlay"><div class="modal"><div class="slip enter">
      <div class="slip-head"><span class="t">결 산 서</span><span class="mode">${bank ? `D${G.day} 폐업` : `D${DAYS} 결산`}</span></div>
      <div class="grade">${grade}</div>
      <h2>${title}</h2>
      <div class="report">${G.report.map(r => `<div>${r}</div>`).join('')}</div>
      <div class="row"><span>최종 현금 (목표 ${won(GOAL)})</span><span>${won(G.cash)}</span></div>
      <div class="row"><span>남은 재고 원가</span><span>${won(G.inv.reduce((a, x) => a + x.cost, 0))}</span></div>
      <div class="row"><span>매입 / 전당</span><span>${s.deals}건 / ${s.pawns}건</span></div>
      <div class="row"><span>환매 / 유질</span><span>${s.redeemed}건 / ${s.forfeited}건</span></div>
      <div class="row"><span>판매 / 압수</span><span>${s.sold}건 / ${s.seized}건</span></div>
      <div class="row"><span>평판</span><span>${G.rep}</span></div>
      <button class="btn primary" data-act="restart">처음부터 다시</button>
    </div></div></div>`;
  }
  return '';
}

function render() {
  V.want = null;
  const ap = Array.from({ length: Math.max(AP_MAX, G.ap) }, (_, i) => `<i class="${i < G.ap ? 'on' : ''}"></i>`).join('');
  document.getElementById('app').innerHTML = `
    <header class="sign">
      <div class="brand"><span class="seal" aria-hidden="true">典當</span><div><h1>나는 전당포 사장이다</h1><small>골목 전당포 · 프로토타입 v0.6</small></div></div>
      <div class="stats">
        <div class="stat"><span class="k">영업일</span><span class="v">D${G.day}/${DAYS}</span></div>
        <div class="stat"><span class="k">현금</span><span class="v">${won(G.cash)}</span></div>
        <div class="stat"><span class="k">평판</span><span class="v">${G.rep}</span></div>
        <div class="stat"><span class="k">금시세 24K 1돈</span><span class="v">${G.gold}만</span></div>
        <div class="stat"><span class="k">감정력</span><span class="ap" aria-label="감정력 ${G.ap}">${ap}</span></div>
      </div>
    </header>
    <div class="main">${renderCounter()}${renderSide()}</div>
    ${renderModal()}`;
  attachStage();
  if (G.phase !== 'intro') scheduleSave();
  scrollFocus();
}

// 휴대폰처럼 한 줄로 쌓인 화면에서 지금 봐야 할 곳이 화면 밖이면 그리로 옮긴다 (보이면 그대로)
function scrollFocus() {
  const want = UI.scrollTo; UI.scrollTo = null;
  const el = want && document.querySelector(want === 'stage' ? '.stage' : '.counter');
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) el.scrollIntoView({ block: want === 'stage' ? 'center' : 'start', behavior: V.reduced ? 'auto' : 'smooth' });
}

document.addEventListener('click', e => {
  const b = e.target.closest('button') || (e.target.matches('.overlay[data-act]') ? e.target : null); if (!b || b.disabled) return;
  const d = b.dataset, c = G.cur;
  if (d.tool) return useTool(d.tool);
  if (d.choice) return choose(Number(d.choice));
  if (d.spot) return inspectSpot(d.spot);
  if (d.step && c) { c.offer = Math.max(1, Math.round(c.offer) + Number(d.step)); return render(); }
  if (d.pct && c) { c.offer = Math.max(1, Math.round(c.ask * Number(d.pct))); return render(); }
  if (d.buyer) return askBuyer(Number(d.buyer));
  if (d.sell) return sellItem(Number(d.sell), false);
  if (d.gold) return sellItem(Number(d.gold), true);
  if (d.hold) return holdItem(Number(d.hold));
  switch (d.act) {
    case 'start': return startDay();
    case 'offer': return makeOffer();
    case 'acceptAsk': return deal(c.ask);
    case 'reject': return rejectGuest();
    case 'next': return nextCustomer();
    case 'buyAP': return buyAP();
    case 'tipOff': G.tutorial = false; return render();
    case 'dex': UI.dex = true; return render();
    case 'dexClose': UI.dex = false; return render();
    case 'continue': return continueGame();
    case 'unfocus': unfocus(); return render();
    case 'endDay': return endDay();
    case 'nextDay': return nextDay();
    case 'restart': newGame(); STORE.save = null; return render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'offer' && G.cur) G.cur.offer = Number(e.target.value) || 0;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.dex) { UI.dex = false; render(); }
  if (e.target.id === 'offer' && e.key === 'Enter') makeOffer();
});

function boot(data) {
  if (!V.r) initViewer();
  if (data && data.G && data.G.reg) G = data.G; else newGame();
  render();
  initStore();
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
